  });
  bindBRDateMask('a-data-inicio');
  bindBRDateMask('a-data-fim');
  // Mantém Data fim nunca antes de Data início (ajusta automaticamente)
  document.getElementById('a-data-inicio').addEventListener('change', () => {
    const di = parseBRDate(document.getElementById('a-data-inicio').value);
    const dfField = document.getElementById('a-data-fim');
    const df = parseBRDate(dfField.value);
    if(di && (!df || df < di)) dfField.value = toBRInputValue(di);
  });

  document.getElementById('a-dia-todo').addEventListener('change', (e) => {
    document.getElementById('a-inicio').disabled = e.target.checked;
    document.getElementById('a-fim').disabled = e.target.checked;
    updatePreview();
  });

  function currentDraft(){
    const diaTodo = document.getElementById('a-dia-todo').checked;
    return {
      id: editing ? editing.id : 'draft',
      status: currentStatus,
      tipoServico: document.getElementById('a-tipo').value.trim(),
      clienteId: document.getElementById('a-cliente').value,
      cidade: document.getElementById('a-cidade').value.trim(),
      data: parseBRDate(document.getElementById('a-data-inicio').value),
      dataFim: parseBRDate(document.getElementById('a-data-fim').value),
      diaTodo,
      horaInicio: diaTodo ? '00:00' : document.getElementById('a-inicio').value,
      horaFim: diaTodo ? '23:59' : document.getElementById('a-fim').value,
      ferramentaIds: Array.from(document.querySelectorAll('.a-ferramenta-chk:checked')).map(el => el.value),
      tecnicoId: document.getElementById('a-tecnico').value,
    };
  }

  function updatePreview(){
    const draft = currentDraft();
    document.getElementById('title-preview').innerHTML = '<strong>' + escapeHtml(buildTitle(draft)) + '</strong>';
    const conflicts = findConflicts(draft);
    const area = document.getElementById('conflict-area');
    area.innerHTML = conflicts.length ? `<div class="warning-box"><span>⚠</span><span>${conflicts.map(escapeHtml).join('<br>')}</span></div>` : '';
  }
  updatePreview();

  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('modal-cancel').addEventListener('click', closeModal);
  if(editing) document.getElementById('modal-delete').addEventListener('click', () => { deleteAppt(editing.id); });

  document.getElementById('modal-save').addEventListener('click', async () => {
    const draft = currentDraft();
    if(!draft.data || !draft.dataFim || !draft.horaInicio || !draft.horaFim){ showAlert('Preencha data início, data fim, início e término.'); return; }
    if(draft.dataFim < draft.data){ showAlert('A data fim não pode ser anterior à data início.'); return; }
    if(draft.data === draft.dataFim && draft.horaFim <= draft.horaInicio){ showAlert('O horário de término deve ser após o início.'); return; }
    if(!draft.tipoServico){ showAlert('Informe o tipo de serviço.'); return; }
    if(!draft.clienteId){ showAlert('Selecione o cliente.'); return; }

    if(editing){
      Object.assign(editing, draft);
    } else {
      draft.id = uid('appt');
      State.appointments.push(draft);
    }
    persist('appointments', (editing ? 'Editou ' : 'Agendou ') + 'atendimento: ' + buildTitle(draft));
    State.selectedDay = draft.data;
    closeModal();
    render();
  });
}
function openBackupViewModal(d){
  const snap = State.backups[d];
  if(!snap) return;
  const findIn = (list, id) => (list || []).find(x => x.id === id);
  const row = (html) => `<div style="font-size:13px; padding:6px 0; border-bottom:1px solid var(--line);">${html}</div>`;
  const section = (title, items, renderItem) => `
    <div style="margin-bottom:16px;">
      <div style="font-size:12px; font-weight:600; color:var(--ink-soft); margin-bottom:4px;">${title} (${items.length})</div>
      ${items.length === 0 ? '<div class="hint">Nenhum registro.</div>' : items.map(renderItem).join('')}
    </div>
  `;

  const ferramentasHtml = section('Ferramentas', snap.tools || [], t => {
    const loc = findIn(snap.locations, t.localUsoId);
    const tec = findIn(snap.technicians, t.tecnicoId);
    return row(`<strong>${escapeHtml(t.tipo)}</strong> — <span class="id-tag">${escapeHtml(t.ferramentaId)}</span>${loc ? ' · ' + escapeHtml(loc.nome) : ''}${tec ? ' · ' + escapeHtml(tec.nome) : ''}`);
  });
  const tecnicosHtml = section('Técnicos', snap.technicians || [], t => row(`${escapeHtml(t.nome)}${t.contato ? ' · ' + escapeHtml(t.contato) : ''}`));
  const locaisHtml = section('Locais de uso', snap.locations || [], l => row(`${escapeHtml(l.nome)}${l.cidade ? ' · ' + escapeHtml(l.cidade) : ''}`));
  const clientesHtml = section('Clientes', snap.clients || [], c => row(`${escapeHtml(c.nome)}${c.cidade ? ' · ' + escapeHtml(c.cidade) : ''}`));
  const agendamentosHtml = section('Agendamentos', snap.appointments || [], a => {
    const cliente = findIn(snap.clients, a.clienteId);
    const titulo = [a.status, a.tipoServico || 'Serviço', cliente ? cliente.nome : '—', a.cidade || '—'].join(' · ');
    const periodo = (a.dataFim && a.dataFim !== a.data) ? (fmtDate(a.data) + ' – ' + fmtDate(a.dataFim)) : fmtDate(a.data);
    return row(`<span class="badge ${a.status==='OK'?'ok':'nok'}" style="margin-right:6px;">${a.status}</span>${escapeHtml(periodo)} ${a.horaInicio}–${a.horaFim} — ${escapeHtml(titulo)}`);
  });

  openModal(`
    <div class="modal-head">
      <h3>Conteúdo do backup — ${fmtDate(d)}</h3>
      <button class="modal-close" id="modal-close">✕</button>
    </div>
    <div class="modal-body" style="max-height:60vh; overflow-y:auto;">
      ${ferramentasHtml}${tecnicosHtml}${locaisHtml}${clientesHtml}${agendamentosHtml}
    </div>
    <div class="modal-foot">
      <button class="btn secondary" id="modal-cancel">Fechar</button>
    </div>
  `);
  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('modal-cancel').addEventListener('click', closeModal);
}

async function deleteAppt(id){
  const appt = findById(State.appointments, id);
  if(appt && !canEditAppt(appt)){
    showAlert('Você só pode remover agendamentos da sua própria agenda.');
    return;
  }
  if(!(await confirmAction('Remover este agendamento?'))) return;
  const titulo = appt ? buildTitle(appt) : '';
  State.appointments = State.appointments.filter(a => a.id !== id);
  persist('appointments', 'Removeu atendimento' + (titulo ? ': ' + titulo : ''));
  render();
}

/* ============ Login / Logout ============ */
function renderLoginScreen(){
  const loginRoot = document.getElementById('login-root');
  const tecOptions = State.technicians.map(t => `<option value="${t.id}">${escapeHtml(t.nome)}</option>`).join('');
  const adminOptions = State.adminUsers.map(u => `<option value="${u.id}">${escapeHtml(u.nome)}</option>`).join('');

  loginRoot.innerHTML = `
    <div class="login-card">
      <div class="login-brand">
        <div class="mark">${BRAND_ICON}</div>
        <div>
          <div class="login-title">Painel de Campo</div>
          <div class="login-sub">Agendamento técnico</div>
        </div>
      </div>
      <div class="segmented" id="login-role" style="margin-bottom:16px;">
        <button type="button" class="active" data-role="tecnico">Técnico</button>
        <button type="button" data-role="admin">Administrador</button>
        <button type="button" data-role="visitante">Visitante</button>
      </div>
      <div id="login-fields"></div>
      <div id="login-msg" class="login-msg"></div>
      <button class="btn" id="login-btn" style="width:100%; justify-content:center; margin-top:10px; padding:11px 14px; font-size:13.5px; border-radius:8px;">Entrar</button>
    </div>
  `;

  let role = 'tecnico';

  function renderFields(){
    const fields = document.getElementById('login-fields');
    if(role === 'tecnico'){
      fields.innerHTML = `
        <div class="field">
          <label for="login-tecnico">Seu nome</label>
          <select id="login-tecnico">
            <option value="">Selecione...</option>
            ${tecOptions}
          </select>
          ${State.technicians.length===0 ? '<div class="hint">Nenhum técnico cadastrado ainda. Peça ao administrador para te cadastrar em "Técnicos".</div>' : ''}
        </div>
        <div class="field" style="margin-top:12px;">
          <label for="login-pin">PIN (se o administrador definiu um para você)</label>
          <input type="text" id="login-pin" placeholder="Deixe em branco se você não tiver PIN">
        </div>
      `;
    } else if(role === 'visitante'){
      fields.innerHTML = `
        <div class="hint">Acesso de visitante: você poderá visualizar as informações do sistema (calendário e cadastros), sem poder criar, editar ou remover nada.</div>
      `;
    } else {
      fields.innerHTML = `
        <div class="field">
          <label for="login-admin">Administrador</label>
          <select id="login-admin">
            <option value="">Selecione...</option>
            ${adminOptions}
          </select>
        </div>
        <div class="field" style="margin-top:12px;">
          <label for="login-senha">Senha</label>
          <input type="password" id="login-senha" placeholder="Senha">
        </div>
      `;
    }
    const firstField = fields.querySelector('input, select');
    if(firstField) firstField.focus();
  }
  renderFields();

  document.querySelectorAll('#login-role button').forEach(b => b.addEventListener('click', () => {
    role = b.dataset.role;
    document.querySelectorAll('#login-role button').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    document.getElementById('login-msg').textContent = '';
    renderFields();
  }));

  document.getElementById('login-btn').addEventListener('click', async () => {
    const msg = document.getElementById('login-msg');
    msg.textContent = '';
    const btn = document.getElementById('login-btn');
    btn.disabled = true;
    try{
      if(role === 'admin'){
        const userId = document.getElementById('login-admin').value;
        const senha = document.getElementById('login-senha').value;
        if(!userId){ msg.textContent = 'Selecione o administrador.'; return; }
        const user = findById(State.adminUsers, userId);
        if(!user){ msg.textContent = 'Senha incorreta.'; return; }
        if(window.usingFirebaseAuth){
          try{ await firebase.auth().signInWithEmailAndPassword(emailAuthAdmin(user), senhaParaFirebase(senha)); }
          catch(e){ msg.textContent = 'Senha incorreta.'; return; }
        } else {
          if(senha !== user.senha){ msg.textContent = 'Senha incorreta.'; return; }
        }
        State.session = { role: 'admin', userId: user.id };
      } else if(role === 'visitante'){
        // Fora do Claude.ai, a própria sessão anônima aberta ao carregar a
        // página já serve para o modo visitante (só leitura).
        State.session = { role: 'visitante' };
        State.calFilter = 'general';
      } else {
        const tecId = document.getElementById('login-tecnico').value;
        const pin = document.getElementById('login-pin').value;
        if(!tecId){ msg.textContent = 'Selecione seu nome.'; return; }
        const tec = findById(State.technicians, tecId);
        if(!tec){ msg.textContent = 'PIN incorreto.'; return; }
        if(window.usingFirebaseAuth){
          try{ await firebase.auth().signInWithEmailAndPassword(emailAuthTecnico(tec), senhaParaFirebase(pin)); }
          catch(e){ msg.textContent = 'PIN incorreto (ou você ainda não tem um PIN definido — peça ao administrador).'; return; }
        } else {
          if(tec.pin && tec.pin !== pin){ msg.textContent = 'PIN incorreto.'; return; }
        }
        State.session = { role: 'tecnico', tecnicoId: tecId };
        State.calFilter = 'own';
      }
      enterApp();
    } finally {
      btn.disabled = false;
    }
  });
}

async function enterApp(){
  document.getElementById('login-root').style.display = 'none';
  document.querySelector('.app').style.display = 'flex';
  State.view = 'calendario';
  State.selectedDay = null;
  renderNav();
  document.getElementById('view-title').textContent = VIEW_META.calendario.title;
  document.getElementById('view-desc').textContent = VIEW_META.calendario.desc;
  render();
  startPolling();
  maybeCreateDailySnapshot();
  registrarLog('Entrou no sistema');
  // Agora que a sessão é "de verdade" (não anônima), a gravação no banco é
  // permitida: é o momento seguro de apagar a senha/PIN em texto puro que
  // ainda estivesse guardada de antes deste ajuste de segurança.
  if(window.usingFirebaseAuth){
    try{
      if(isAdmin()){
        const u = findById(State.adminUsers, State.session.userId);
        if(u && u.senha){ delete u.senha; persist('adminUsers'); }
      } else if(isTecnico()){
        const t = findById(State.technicians, State.session.tecnicoId);
        if(t && t.pin){ delete t.pin; t.temPin = true; persist('technicians'); }
      }
    }catch(e){ console.error('Não foi possível concluir a limpeza de credenciais antigas', e); }
  }
}

function logout(){
  registrarLog('Saiu do sistema');
  stopPolling();
  State.session = null;
  document.querySelector('.app').style.display = 'none';
  document.getElementById('login-root').style.display = 'flex';
  if(window.usingFirebaseAuth){
    // Volta para uma sessão anônima (só leitura) para que a tela de login
    // consiga mostrar a lista de nomes de novo.
    firebase.auth().signOut().then(() => firebase.auth().signInAnonymously()).catch(() => {});
  }
  renderLoginScreen();
}

/* ============ Enter confirma / Tab passa campo ============
   Tab já funciona nativamente (ordem dos campos no HTML).
   Este listener único cobre Enter em: tela de login, qualquer
   modal (ferramenta, técnico, local, cliente, agendamento) e o
   formulário de troca de senha em Acessos. */
document.addEventListener('keydown', (e) => {
  if(e.key !== 'Enter') return;
  if(e.target.tagName === 'BUTTON' || e.target.tagName === 'TEXTAREA') return;

  const modalBackdrop = document.getElementById('modal-backdrop');
  if(modalBackdrop && modalBackdrop.contains(e.target)){
    const saveBtn = document.getElementById('modal-save');
    if(saveBtn){ e.preventDefault(); saveBtn.click(); }
    return;
  }

  const loginRoot = document.getElementById('login-root');
  if(loginRoot && loginRoot.contains(e.target)){
    const loginBtn = document.getElementById('login-btn');
    if(loginBtn){ e.preventDefault(); loginBtn.click(); }
    return;
  }

  if(['ac-atual','ac-nova','ac-confirma'].includes(e.target.id)){
    const acSalvar = document.getElementById('ac-salvar');
    if(acSalvar){ e.preventDefault(); acSalvar.click(); }
    return;
  }

  if(['pf-atual','pf-novo','pf-confirma'].includes(e.target.id)){
    const pfSalvar = document.getElementById('pf-salvar');
    if(pfSalvar){ e.preventDefault(); pfSalvar.click(); }
  }
});

/* ============ Armazenamento fora do Claude.ai (Firebase) ============
   Dentro do Claude.ai existe "window.storage" (get/set) pronto. Fora
   dali — por exemplo, este mesmo arquivo hospedado no GitHub Pages —
   esse recurso não existe, então aqui a gente substitui por um banco
   de dados na nuvem (Firebase Firestore, camada gratuita do Google),
   guardando cada "chave" (técnicos, clientes, agendamentos etc.) como
   um documento. O resto do app continua chamando window.storage.get/
   set exatamente como antes — só essa parte muda por baixo, então
   não foi preciso tocar em mais nada do código. */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAL6t-EcRPD7HCWsWOivNCikDa4fgwlIEo",
  authDomain: "painel-de-campo.firebaseapp.com",
  projectId: "painel-de-campo",
  storageBucket: "painel-de-campo.firebasestorage.app",
  messagingSenderId: "344354045187",
  appId: "1:344354045187:web:09cc11bc4ce593c5bb3d36",
};
function carregarScriptExterno(src){
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src;
    s.onload = () => resolve();
    s.onerror = () => reject(new Error('Falha ao carregar ' + src));
    document.head.appendChild(s);
  });
}
async function ativarArmazenamentoFirebase(){
  await carregarScriptExterno('https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js');
  await carregarScriptExterno('https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js');
  await carregarScriptExterno('https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js');
  firebase.initializeApp(FIREBASE_CONFIG);
  window.usingFirebaseAuth = true;
  // Sessão anônima só para conseguir ler a lista de nomes da tela de login
  // (ela é obrigatória assim que as regras do banco passam a exigir login).
  // Essa sessão não dá nenhum poder de gravação — isso é garantido pelas
  // regras do Firestore, não só pelo código aqui.
  await firebase.auth().signInAnonymously();
  const colecao = firebase.firestore().collection('painelDeCampo');
  window.storage = {
    get: async (key) => {
      const doc = await colecao.doc(key).get();
      return { value: doc.exists ? doc.data().value : undefined };
    },
    set: async (key, value) => {
      await colecao.doc(key).set({ value });
      return true;
    },
  };
}

/* ============ Autenticação (Firebase Auth) ============
   Só entra em ação quando ativarArmazenamentoFirebase() ligou o
   armazenamento em nuvem (window.usingFirebaseAuth). Dentro do Claude.ai
   a aplicação continua comparando senha/PIN como sempre comparou — nada
   muda nesse caminho.

   Como não há servidor próprio, usamos o próprio Firebase Authentication
   como "cofre" das senhas (ele nunca devolve a senha de ninguém pelo
   código do navegador) em vez de guardar senha/PIN em texto no banco.
   Cada administrador/técnico tem uma conta de login "disfarçada" com um
   e-mail interno (nunca usado para enviar e-mail de verdade), amarrada
   ao id do cadastro dele.

   Limitação conhecida e aceita: como não existe um servidor para revogar
   contas de terceiros, uma troca de senha/PIN feita pelo próprio usuário
   (que informa a senha/PIN atual) invalida a anterior imediatamente; já
   uma redefinição feita por um administrador (que não sabe a senha/PIN
   anterior) cria uma conta nova e troca qual conta a tela de login tenta
   usar, mas não consegue apagar a conta antiga no Firebase — ela fica
   órfã e tecnicamente ainda existiria para quem soubesse a senha/PIN
   antiga e o endereço técnico interno dela. */
function authSecundario(){
  try{ return firebase.app('secundario').auth(); }
  catch(e){ return firebase.initializeApp(FIREBASE_CONFIG, 'secundario').auth(); }
}
function senhaParaFirebase(s){
  // O Firebase exige ao menos 6 caracteres. Para não obrigar administradores
  // e técnicos a usarem senhas/PINs mais longos do que já usam, preenchemos
  // por baixo dos panos quando necessário — sem reduzir a senha/PIN real
  // que a pessoa digita.
  s = String(s || '');
  return s.length >= 6 ? s : (s + '-pdc-' + s).slice(0, 24);
}
function emailAuthAdmin(u){ return 'admin-' + u.id + '-v' + (u.authVersao || 1) + '@painel-de-campo.app'; }
function emailAuthTecnico(t){ return 'tec-' + t.id + '-v' + (t.pinVersao || 1) + '@painel-de-campo.app'; }
async function criarContaAuthSecundaria(email, senha){
  const auth = authSecundario();
  await auth.createUserWithEmailAndPassword(email, senhaParaFirebase(senha));
  await auth.signOut();
}
async function substituirContaAuthConhecendoAntiga(email, senhaAntiga, senhaNova){
  const auth = authSecundario();
  try{
    await auth.signInWithEmailAndPassword(email, senhaParaFirebase(senhaAntiga));
    await auth.currentUser.delete();
  }catch(e){ /* mesmo sem conseguir confirmar/apagar a conta antiga, seguimos para criar a nova */ }
  await auth.createUserWithEmailAndPassword(email, senhaParaFirebase(senhaNova));
  await auth.signOut();
}
async function verificarSenhaAuth(email, senha){
  const auth = authSecundario();
  try{
    await auth.signInWithEmailAndPassword(email, senhaParaFirebase(senha));
    await auth.signOut();
    return true;
  }catch(e){ return false; }
}
/* Cria, na primeira vez que a aplicação nova carregar, uma conta de login
   no Firebase para quem ainda só tinha senha/PIN em texto (dados antigos,
   de antes deste ajuste). Não apaga o campo de texto ainda — isso só
   acontece com segurança depois que a própria pessoa faz login (ver
   enterApp), porque só então temos permissão de gravação no banco. */
async function criarContasAuthFaltantes(){
  for(const u of State.adminUsers){
    if(!u.senha) continue;
    try{ await criarContaAuthSecundaria(emailAuthAdmin(u), u.senha); }
    catch(e){ /* já deve existir de uma tentativa anterior — ignora */ }
  }
  for(const t of State.technicians){
    if(!t.pin) continue;
    try{ await criarContaAuthSecundaria(emailAuthTecnico(t), t.pin); }
    catch(e){ /* já deve existir de uma tentativa anterior — ignora */ }
  }
}

/* ============ Init ============ */
(async function init(){
  if(typeof window.storage === 'undefined' || !window.storage || typeof window.storage.get !== 'function'){
    try{
      await ativarArmazenamentoFirebase();
    }catch(e){
      console.error('Não foi possível conectar ao armazenamento (Firebase)', e);
      document.body.innerHTML = `
        <div style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; font-family:'IBM Plex Sans', sans-serif; background:#EEF1F0;">
          <div style="max-width:440px; background:#fff; border-radius:8px; padding:28px 26px; box-shadow:0 12px 40px rgba(20,32,36,0.15);">
            <h2 style="margin:0 0 12px 0; font-size:17px; color:#16262B;">Não foi possível conectar ao armazenamento</h2>
            <p style="font-size:13.5px; line-height:1.6; color:#4B5C61; margin:0;">
              Verifique sua conexão com a internet e tente de novo em alguns instantes. Se o problema continuar, pode ser necessário revisar a configuração do banco de dados (Firebase).
            </p>
          </div>
        </div>
      `;
      return;
    }
  }
  // Janela de login Microsoft (aberta pelo próprio app): só devolve o código para a janela principal.
  if(window.opener && /[#&](code|error)=/.test(location.hash)) return;
  await loadAll();
  if(window.usingFirebaseAuth){
    try{ await criarContasAuthFaltantes(); }
    catch(e){ console.error('Não foi possível preparar contas de login no Firebase', e); }
  }
  renderLoginScreen();
})();
</script>
