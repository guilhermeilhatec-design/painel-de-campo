<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Campo — Agendamento Técnico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg: #EEF1F0;
    --surface: #FFFFFF;
    --surface-raised: #F7F9F8;
    --ink: #16262B;
    --ink-soft: #4B5C61;
    --muted: #7C8A8F;
    --line: #D7DEDC;
    --line-strong: #B9C4C1;
    --teal: #2B6777;
    --teal-dark: #1E4B57;
    --teal-tint: #E3EEF0;
    --ok: #3F7D4C;
    --ok-tint: #E4F0E5;
    --nok: #B23A2E;
    --nok-tint: #F6E4E1;
    --amber: #B9812F;
    --amber-tint: #F7E9D2;
    --yellow: #9C7A1F;
    --yellow-tint: #FBF0DC;
    --blue: #2B6B95;
    --blue-tint: #DCEAF7;
    --gray: #6B7680;
    --gray-tint: #E6E8E7;
    --purple: #6B3FA0;
    --purple-tint: #EAE1F5;
    --radius-s: 4px;
    --radius-m: 8px;
    --shadow-modal: 0 12px 40px rgba(20,32,36,0.22);
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans', system-ui, sans-serif;
    font-size:14px;
    line-height:1.5;
  }
  code, .mono, .id-tag, .field-mono input, .kbd{
    font-family:'IBM Plex Mono', monospace;
  }
  h1,h2,h3{ font-family:'IBM Plex Sans', sans-serif; margin:0; letter-spacing:-0.01em; }
  button{ font-family:inherit; }

  /* ---------- App shell ---------- */
  .app{ display:flex; min-height:100vh; }

  .sidebar{
    width:220px;
    flex-shrink:0;
    background:var(--teal-dark);
    color:#DCEAEC;
    display:flex;
    flex-direction:column;
    padding:20px 0;
    transition:width .15s ease;
  }
  .brand{
    padding:0 20px 16px 20px;
    border-bottom:1px solid rgba(255,255,255,0.12);
    margin-bottom:6px;
    display:flex; align-items:center; gap:10px;
  }
  .brand .mark{
    width:34px; height:34px; flex-shrink:0;
    border:1.5px solid #DCEAEC;
    border-radius:var(--radius-s);
    display:flex; align-items:center; justify-content:center;
    color:#DCEAEC;
  }
  .brand-text{ min-width:0; overflow:hidden; }
  .brand .name{ font-weight:600; font-size:15px; color:#fff; white-space:nowrap; }
  .brand .sub{ font-size:12px; color:#9BB6BC; margin-top:2px; white-space:nowrap; }

  .sidebar-toggle{
    all:unset; cursor:pointer; display:flex; align-items:center; gap:10px;
    margin:6px 10px 10px 10px; padding:8px 10px; border-radius:var(--radius-s);
    color:#9BB6BC; font-size:12px;
  }
  .sidebar-toggle:hover{ background:rgba(255,255,255,0.06); color:#fff; }

  .nav{ display:flex; flex-direction:column; gap:2px; padding:0 10px; }
  .nav button{
    all:unset;
    cursor:pointer;
    padding:10px 12px;
    border-radius:var(--radius-s);
    font-size:13.5px;
    color:#C7DBDE;
    display:flex; align-items:center; gap:10px;
    white-space:nowrap;
  }
  .nav button:hover{ background:rgba(255,255,255,0.06); color:#fff; }
  .nav button.active{ background:#DCEAEC; color:var(--teal-dark); font-weight:600; }
  .nav-icon{ display:flex; align-items:center; justify-content:center; width:16px; flex-shrink:0; }

  .sidebar-foot{
    margin-top:auto;
    padding:14px 20px 0 20px;
    border-top:1px solid rgba(255,255,255,0.12);
    font-size:11.5px;
    color:#8FACB1;
    white-space:nowrap;
    overflow:hidden;
  }

  /* Selo de versão — canto inferior direito, visível em qualquer tela
     (login, app, modal) para saber qual versão está no ar. */
  .app-version-tag{
    position:fixed; right:10px; bottom:8px; z-index:50;
    font-size:10.5px; color:var(--muted); background:rgba(255,255,255,0.85);
    padding:2px 7px; border-radius:var(--radius-s); pointer-events:none;
    font-family:'IBM Plex Mono', monospace;
  }

  /* Barra lateral recolhida: só ícones */
  .sidebar.collapsed{ width:64px; }
  .sidebar.collapsed .brand{ justify-content:center; padding-left:0; padding-right:0; }
  .sidebar.collapsed .brand-text,
  .sidebar.collapsed .sidebar-toggle .label,
  .sidebar.collapsed .nav button .label,
  .sidebar.collapsed .sidebar-foot{ display:none; }
  .sidebar.collapsed .sidebar-toggle{ justify-content:center; }
  .sidebar.collapsed .nav button{ justify-content:center; }

  .main{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .topbar{
    padding:22px 32px 0 32px;
  }
  .topbar h1{ font-size:21px; }
  .topbar .desc{ color:var(--muted); font-size:13px; margin-top:4px; }
  .content{ padding:20px 32px 48px 32px; flex:1; }

  .toolbar{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:16px; gap:12px; flex-wrap:wrap;
  }
  .toolbar-left{ display:flex; align-items:center; gap:10px; }

  .bulk-bar{
    display:flex; align-items:center; gap:10px; justify-content:space-between;
    background:var(--nok-tint); border:1px solid #E3B8B0; color:#7A281E;
    padding:8px 12px; border-radius:var(--radius-s); font-size:12.5px; margin-bottom:10px;
  }
  input.row-select, input.row-select-all{ width:15px; height:15px; cursor:pointer; }

  .log-group{
    border:1px solid var(--line); border-radius:var(--radius-s); margin-bottom:8px; overflow:hidden; background:var(--surface);
  }
  .log-group-head{
    all:unset; cursor:pointer; display:flex; align-items:center; gap:10px;
    width:100%; box-sizing:border-box; padding:10px 14px; font-size:13px;
  }
  .log-group-head:hover{ background:var(--surface-raised); }
  .log-group-chevron{
    display:inline-block; font-size:14px; color:var(--muted); transition:transform .12s ease;
  }
  .log-group-chevron.open{ transform:rotate(90deg); }
  .log-group-date{ font-weight:600; color:var(--ink); }
  .log-group-count{ color:var(--muted); font-size:12px; }
  .log-group-table{ width:100%; border-collapse:collapse; border-top:1px solid var(--line); }
  .log-group-table th{
    text-align:left; font-size:11px; font-weight:600; color:var(--muted);
    padding:8px 14px; background:var(--surface-raised); border-bottom:1px solid var(--line);
  }
  .log-group-table td{ padding:8px 14px; border-bottom:1px solid var(--line); }
  .log-group-table tr:last-child td{ border-bottom:none; }

  .context-menu{
    position:fixed; z-index:300; background:var(--surface); border:1px solid var(--line-strong);
    border-radius:var(--radius-s); box-shadow:var(--shadow-modal); padding:4px; min-width:190px;
  }
  .context-menu-item{
    all:unset; cursor:pointer; display:block; width:100%; box-sizing:border-box;
    padding:8px 10px; font-size:13px; color:var(--ink); border-radius:3px;
  }
  .context-menu-item:hover{ background:var(--surface-raised); }

  .btn{
    all:unset; box-sizing:border-box; cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    padding:9px 14px;
    border-radius:var(--radius-s);
    font-size:13px; font-weight:600;
    background:var(--teal); color:#fff;
    border:1px solid var(--teal);
    transition:background .15s ease, transform .1s ease;
  }
  .btn:hover{ background:var(--teal-dark); }
  .btn:active{ transform:scale(0.98); }
  .btn.secondary{
    background:transparent; color:var(--ink); border:1px solid var(--line-strong);
  }
  .btn.secondary:hover{ background:var(--surface-raised); }
  .btn.danger{ background:transparent; color:var(--nok); border:1px solid var(--nok); }
  .btn.danger:hover{ background:var(--nok-tint); }
  .btn:disabled{ opacity:0.45; cursor:not-allowed; }
  .btn.small{ padding:6px 10px; font-size:12px; }

  /* ---------- Tables ---------- */
  .panel{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius-m);
    overflow:hidden;
  }
  table{ width:100%; border-collapse:collapse; }
  thead th{
    text-align:left;
    font-size:11.5px;
    font-weight:600;
    color:var(--muted);
    padding:10px 16px;
    border-bottom:1px solid var(--line);
    background:var(--surface-raised);
  }
  tbody td{
    padding:11px 16px;
    border-bottom:1px solid var(--line);
    font-size:13.5px;
    vertical-align:middle;
  }
  tbody tr:last-child td{ border-bottom:none; }
  tbody tr:hover{ background:var(--surface-raised); }
  .id-tag{
    display:inline-block;
    font-size:12px;
    background:var(--teal-tint);
    color:var(--teal-dark);
    padding:2px 7px;
    border-radius:3px;
  }
  .row-actions{ display:flex; gap:6px; justify-content:flex-end; }
  .icon-btn{
    all:unset; cursor:pointer; color:var(--muted);
    padding:4px 8px; border-radius:var(--radius-s); font-size:12px;
  }
  .icon-btn:hover{ background:var(--surface-raised); color:var(--ink); }
  .icon-btn.danger:hover{ color:var(--nok); }

  .empty-state{
    padding:48px 24px; text-align:center; color:var(--muted);
  }
  .empty-state .big{ font-size:14px; color:var(--ink-soft); margin-bottom:4px; font-weight:600;}

  /* ---------- Badges ---------- */
  .badge{
    display:inline-flex; align-items:center; gap:5px;
    font-size:11.5px; font-weight:600; padding:3px 8px; border-radius:3px;
  }
  .badge.ok{ background:var(--ok-tint); color:var(--ok); }
  .badge.nok{ background:var(--nok-tint); color:var(--nok); }
  .badge.amarelo{ background:var(--yellow-tint); color:var(--yellow); }
  .badge.laranja{ background:var(--amber-tint); color:var(--amber); }
  .badge.azul{ background:var(--blue-tint); color:var(--blue); }
  .badge.cinza{ background:var(--gray-tint); color:var(--gray); }
  .badge.roxo{ background:var(--purple-tint); color:var(--purple); }
  .badge .dot{ width:6px; height:6px; border-radius:50%; background:currentColor; }
  .status-icon{ flex-shrink:0; display:inline-block; vertical-align:-2px; }

  /* ---------- Autocomplete (combobox) ---------- */
  .autocomplete-wrap{ position:relative; }
  .autocomplete-dropdown{
    position:absolute; left:0; right:0; top:calc(100% + 4px); z-index:40;
    background:var(--surface); border:1px solid var(--line-strong); border-radius:var(--radius-s);
    box-shadow:0 8px 24px rgba(20,32,36,0.18); max-height:220px; overflow-y:auto;
  }
  .autocomplete-item{ padding:8px 10px; font-size:13px; cursor:pointer; }
  .autocomplete-item.active{ background:var(--teal-tint); }
  .autocomplete-item:hover{ background:var(--surface-raised); }
  .autocomplete-empty{ padding:8px 10px; font-size:13px; color:var(--muted); }
  .autocomplete-selected-ok{ border-color:var(--ok) !important; }

  /* ---------- Seletor de data (calendário popup) ----------
     Abre por padrão em qualquer campo de data (ligado via bindBRDateMask),
     como alternativa visual à digitação manual (que continua funcionando
     normalmente). Fica fora do fluxo normal da página (position:fixed,
     anexado ao body) para não ser cortado por modais com rolagem. */
  .dp-popup{
    position:fixed; z-index:500; width:236px;
    background:var(--surface); border:1px solid var(--line-strong); border-radius:var(--radius-m);
    box-shadow:var(--shadow-modal); padding:10px; font-size:12.5px;
  }
  .dp-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .dp-label{ font-weight:600; font-size:12.5px; color:var(--ink); }
  .dp-nav{ all:unset; cursor:pointer; padding:3px 9px; border-radius:var(--radius-s); color:var(--ink-soft); }
  .dp-nav:hover{ background:var(--surface-raised); }
  .dp-grid{ display:grid; grid-template-columns:repeat(7, 1fr); gap:2px; }
  .dp-dow{ text-align:center; font-size:10px; color:var(--muted); padding:3px 0 5px; }
  .dp-cell{
    all:unset; text-align:center; font-size:12px; padding:6px 0; border-radius:var(--radius-s);
    cursor:pointer; color:var(--ink);
  }
  .dp-cell:hover{ background:var(--surface-raised); }
  .dp-cell.outside{ color:var(--muted); opacity:0.55; }
  .dp-cell.today{ font-weight:700; color:var(--teal); }
  .dp-cell.selected{ background:var(--teal); color:#fff; }
  .dp-foot{ display:flex; justify-content:space-between; gap:6px; margin-top:8px; padding-top:8px; border-top:1px solid var(--line); }
  .dp-foot-btn{ all:unset; cursor:pointer; font-size:12px; color:var(--teal-dark); padding:3px 6px; border-radius:var(--radius-s); }
  .dp-foot-btn:hover{ background:var(--teal-tint); }

  /* ---------- Forms / Modal ---------- */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(15,25,28,0.45);
    display:flex; align-items:flex-start; justify-content:center;
    padding:40px 20px; overflow-y:auto; z-index:100;
  }
  .modal{
    background:var(--surface);
    border-radius:var(--radius-m);
    width:100%; max-width:480px;
    box-shadow:var(--shadow-modal);
    animation:modalIn .15s ease-out;
  }
  @keyframes modalIn{ from{ opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  .modal-head{
    padding:18px 22px; border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between;
  }
  .modal-head h3{ font-size:15.5px; }
  .modal-close{ all:unset; cursor:pointer; color:var(--muted); font-size:18px; line-height:1; padding:2px 6px; }
  .modal-close:hover{ color:var(--ink); }
  .modal-body{ padding:20px 22px; display:flex; flex-direction:column; gap:14px; }
  .modal-foot{ padding:16px 22px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:8px; }

  .field label{
    display:block; font-size:12px; font-weight:600; color:var(--ink-soft);
    margin-bottom:6px;
  }
  .field .hint{ font-size:11.5px; color:var(--muted); margin-top:4px; }
  .field input[type=text], .field input[type=date], .field input[type=time], .field select, .field textarea{
    width:100%; padding:9px 10px; border:1px solid var(--line-strong);
    border-radius:var(--radius-s); font-size:13.5px; color:var(--ink);
    background:#fff; font-family:inherit;
  }
  .field input:focus, .field select:focus, .field textarea:focus{
    outline:2px solid var(--teal); outline-offset:1px; border-color:var(--teal);
  }
  .field-row{ display:flex; gap:12px; }
  .field-row .field{ flex:1; }

  .segmented{
    display:flex; background:var(--surface-raised); border:1px solid var(--line);
    border-radius:999px; padding:3px; gap:2px;
  }
  .segmented button{
    all:unset; box-sizing:border-box; cursor:pointer; flex:1; text-align:center; padding:7px 12px;
    font-size:12.5px; font-weight:600; color:var(--ink-soft); border-radius:999px;
    transition:background .15s ease, color .15s ease;
  }
  .segmented button:hover{ color:var(--ink); }
  .segmented button.active{ background:var(--teal); color:#fff; box-shadow:0 1px 4px rgba(20,32,36,0.18); }
  .segmented button.sel-ok.active{ background:var(--ok); color:#fff; }
  .segmented button.sel-nok.active{ background:var(--nok); color:#fff; }

  .title-preview{
    background:var(--surface-raised); border:1px dashed var(--line-strong);
    border-radius:var(--radius-s); padding:10px 12px; font-size:13px;
    color:var(--ink-soft);
  }
  .title-preview strong{ color:var(--ink); font-weight:600; }

  .month-chip{
    all:unset; cursor:pointer; padding:5px 10px; border:1px solid var(--line-strong); border-radius:12px;
    font-size:11.5px; color:var(--ink-soft);
  }
  .month-chip.active{ background:var(--teal-tint); color:var(--teal-dark); border-color:var(--teal); font-weight:600; }

  .warning-box{
    background:var(--nok-tint); border:1px solid #E3B8B0; color:#7A281E;
    border-radius:var(--radius-s); padding:10px 12px; font-size:12.5px;
    display:flex; gap:8px;
  }

  /* ---------- Calendar ---------- */
  .cal-head{
    display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;
  }
  .cal-nav{ display:flex; align-items:center; gap:10px; }
  .cal-nav .month-label{ font-size:16px; font-weight:600; min-width:170px; text-align:center; }
  .cal-nav button{
    all:unset; cursor:pointer; width:30px; height:30px; border:1px solid var(--line-strong);
    border-radius:var(--radius-s); display:flex; align-items:center; justify-content:center;
    color:var(--ink-soft);
  }
  .cal-nav button:hover{ background:var(--surface-raised); }

  .cal-grid{
    display:grid; grid-template-columns:repeat(7, 1fr);
    border:1px solid var(--line); border-radius:var(--radius-m); overflow:hidden;
    background:var(--line); position:relative;
    gap:1px;
  }
  .cal-dow{
    background:var(--surface-raised); height:34px; box-sizing:border-box; padding:0 10px;
    display:flex; align-items:center; font-size:calc(11px * var(--calz, 1)); font-weight:600;
    color:var(--muted);
  }
  .cal-cell{
    background:var(--surface); height:calc(112px * var(--calz, 1.1)); padding:7px; cursor:pointer;
    display:flex; flex-direction:column; gap:3px; overflow:hidden;
  }
  .cal-cell:hover{ background:var(--surface-raised); }
  .cal-cell.outside{ background:#F4F5F4; color:var(--muted); cursor:default; }

  .cal-week-grid{
    display:grid; gap:1px; background:var(--line); position:relative;
    border:1px solid var(--line); border-radius:var(--radius-m); overflow:hidden;
  }
  .cal-daycol{
    background:var(--surface); display:flex; flex-direction:column; cursor:pointer;
  }
  .cal-daycol:hover{ background:var(--surface-raised); }
  .cal-daycol.today{ background:#F2F8F9; }
  .cal-daycol-head{
    height:54px; box-sizing:border-box; display:flex; flex-direction:column; justify-content:center;
    padding:0 10px; border-bottom:1px solid var(--line); text-align:center; background:var(--surface-raised);
  }
  .cal-daycol-dow{ font-size:calc(10.5px * var(--calz, 1)); font-weight:600; color:var(--muted); }
  .cal-daycol-num{ font-size:calc(15px * var(--calz, 1)); font-weight:600; color:var(--ink-soft); margin-top:2px; }
  .cal-daycol.today .cal-daycol-num{ color:var(--teal); }
  .cal-daycol-body{ padding:8px; height:calc(260px * var(--calz, 1)); overflow:hidden; position:relative; box-sizing:border-box; }
  .cal-daycol-empty{ font-size:11px; color:var(--muted); text-align:center; margin-top:10px; }
  .cal-cell.outside:hover{ background:#F4F5F4; }
  .cal-cell .daynum{ font-size:calc(12px * var(--calz, 1)); font-weight:600; color:var(--ink-soft); }
  .cal-cell.today .daynum{
    background:var(--teal); color:#fff; width:20px; height:20px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-size:calc(11.5px * var(--calz, 1));
  }
  .cal-evt-bar{
    position:absolute; box-sizing:border-box; z-index:2; cursor:pointer;
    font-size:calc(10.5px * var(--calz, 1)); line-height:1.35; border-radius:0;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    color:#fff; display:flex; align-items:center; gap:5px; padding:0 6px;
    box-shadow:0 0 0 1px rgba(255,255,255,0.25) inset;
  }
  .cal-evt-bar.rl{ border-top-left-radius:4px; border-bottom-left-radius:4px; }
  .cal-evt-bar.rr{ border-top-right-radius:4px; border-bottom-right-radius:4px; }
  .cal-evt-bar .status-dot{ width:7px; height:7px; border-radius:50%; flex-shrink:0; box-shadow:0 0 0 1px rgba(255,255,255,0.7); }
  .cal-evt-bar .status-dot.ok{ background:#3FCF63; }
  .cal-evt-bar .status-dot.nok{ background:#FF6B5B; }
  .cal-evt-more{ font-size:calc(10px * var(--calz, 1)); color:var(--muted); padding-left:2px; }
  .cal-evt-resize{
    position:absolute; top:0; bottom:0; width:9px; cursor:ew-resize; z-index:3;
    display:flex; align-items:center; justify-content:center;
  }
  .cal-evt-resize::after{ content:''; width:2px; height:60%; background:rgba(255,255,255,0.8); border-radius:2px; }
  .cal-evt-resize-l{ left:0; }
  .cal-evt-resize-r{ right:0; }
  .cal-evt-resize:hover::after{ background:#fff; width:3px; }
  .cal-dropzone.resize-preview{ background:rgba(43,122,120,0.14); outline:2px dashed var(--teal); outline-offset:-2px; }
  .cal-zoom{ display:flex; align-items:center; gap:4px; }
  .cal-zoom button{
    width:26px; height:26px; border:1px solid var(--line-strong); background:var(--surface);

<script>
/* ============ Estado & persistência ============ */
const STORE_SHARED = true; // dados de equipe: visíveis para todos os usuários deste app

/* ============ Versão do sistema ============
   Atualizada manualmente a cada publicação, pra dar pra confirmar qual
   versão está no ar (ex.: depois de uma atualização, comparar se o selo
   mudou). Aparece num selo discreto no canto inferior direito, em
   qualquer tela, e também em Acessos > Log de ações. */
const APP_VERSION = '2026-10-04 21:50';
document.getElementById('app-version-tag').textContent = 'v' + APP_VERSION;

/* ============ Ícones (SVG simples, herdam a cor do texto) ============ */
const ICONS = {
  calendario: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="16" y1="2" x2="16" y2="6"/></svg>',

};
const BRAND_ICON = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="3" y1="12" x2="21" y2="12"/></svg>';
const LOGOUT_ICON = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>';
const TOGGLE_ICON = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>';

const State = {
  tools: [],
  technicians: [],
  locations: [],
  clients: [],
  appointments: [],
  contracts: [],
  contratosTab: 'comercial',
  pendencias: [],
  pendenciasFiltro: {},
  settings: null,
  backups: {},
  adminUsers: [],
  logs: [],
  bulkSelection: {}, // key -> Set(ids) — seleção de checkboxes nas tabelas, não é salva
  logFiltro: { de:'', ate:'', quem:'', acao:'' },
  logExpanded: new Set(), // datas (YYYY-MM-DD) do log atualmente expandidas
  calTecnicoFiltro: '', // admin: filtrar calendário por técnico
  clientesFiltro: '',
  ferramentasFiltro: '',
  simpleFiltro: {}, // view ('tecnicos'|'locais') -> texto de busca
  contratosFiltro: '',
  serviceTypes: [],
  tableSort: {}, // chave da tabela -> {campo, dir} — ordenação padronizada em todas as listas
  session: null,       // { role: 'admin' } ou { role: 'tecnico', tecnicoId }
  calFilter: 'own',    // 'own' | 'general' — usado pela agenda do técnico
  view: 'calendario',
  calView: 'mes', // 'mes' | 'semana' | 'semanautil' | 'dia'
  calAnchor: new Date(new Date().getFullYear(), new Date().getMonth(), new Date().getDate()),
  selectedDay: null,
  calFontScale: 1.1, // ajuste de tamanho de texto do calendário (botões A-/A+), só nesta sessão
};

async function loadAll(){
  const keys = ['tools','technicians','locations','clients','appointments','contracts','pendencias','settings','backups','adminUsers','logs','serviceTypes'];
  await Promise.all(keys.map(async k => {
    const objDefault = (k === 'settings' || k === 'backups');
    try{
      const r = await window.storage.get(k, STORE_SHARED);
      State[k] = r && r.value ? JSON.parse(r.value) : (objDefault ? (k === 'backups' ? {} : null) : []);
    }catch(e){
      State[k] = objDefault ? (k === 'backups' ? {} : null) : [];
    }
  }));
  if(!State.settings){
    State.settings = { adminPassword: 'admin123' };
    await persist('settings');
  }
  if(!State.backups) State.backups = {};
  State.clients = (State.clients || []).map(c => ({ ...c, cidade: c.cidade || c.cidadePadrao || '' }));
  State.appointments = (State.appointments || []).map(a => a.ferramentaIds ? a : ({ ...a, ferramentaIds: a.ferramentaId ? [a.ferramentaId] : [] }));
  State.appointments = (State.appointments || []).map(a => a.dataFim ? a : ({ ...a, dataFim: a.data }));
  State.pendencias = (State.pendencias || []).map(p => p.padraoIds ? p : ({ ...p, padraoIds: p.padraoId ? [p.padraoId] : [] }));
  State.pendencias = (State.pendencias || []).map(p => (p.dataAgendada && !p.dataAgendadaFim) ? ({ ...p, dataAgendadaFim: p.dataAgendada }) : p);
  // Migração: antes, cada serviço do plano de manutenção gerava um chamado
  // separado no mesmo mês (chaveOrigem no formato "TIPO-AAAA-MM"), e passou
  // a gerar um único chamado por mês reunindo todos os serviços daquele mês
  // ("servicos": lista) — um só registro pra agendar/gerenciar, mesmo com
  // mais de um serviço previsto. Consolida o que já existia salvo no
  // formato antigo; não faz nada se não houver nada do formato antigo.
  if(State.pendencias.some(p => p.origem === 'contrato' && /^[A-Za-z]+-\d{4}-\d{2}$/.test(p.chaveOrigem || ''))){
    const consolidadasPorGrupo = new Map();
    const novasPendencias = [];
    State.pendencias.forEach(p => {
      const antigo = p.origem === 'contrato' && /^[A-Za-z]+-\d{4}-\d{2}$/.test(p.chaveOrigem || '');
      if(!antigo){ novasPendencias.push(p); return; }
      const mesChave = p.chaveOrigem.replace(/^[A-Za-z]+-/, '');
      const chaveGrupo = p.contractId + '|' + mesChave;
      const existente = consolidadasPorGrupo.get(chaveGrupo);
      if(!existente){
        const consolidada = { ...p, chaveOrigem: mesChave, servicos: pendenciaServicosArray(p) };
        delete consolidada.servico;
        delete consolidada.planoManutencao;
        consolidadasPorGrupo.set(chaveGrupo, consolidada);
        novasPendencias.push(consolidada);
      } else {
        pendenciaServicosArray(p).forEach(t => { if(!existente.servicos.includes(t)) existente.servicos.push(t); });
        if(p.dataAgendada && !existente.dataAgendada){ existente.dataAgendada = p.dataAgendada; existente.dataAgendadaFim = p.dataAgendadaFim || p.dataAgendada; }
        if(p.observacoes && !(existente.observacoes || '').includes(p.observacoes)) existente.observacoes = [existente.observacoes, p.observacoes].filter(Boolean).join(' · ');
        existente.confirmado = existente.confirmado && p.confirmado; // só fica "OK" se todos os serviços já estavam confirmados
        (p.padraoIds || []).forEach(id => { if(!existente.padraoIds.includes(id)) existente.padraoIds.push(id); });
      }
    });
    State.pendencias = novasPendencias;
    await persist('pendencias', 'Migração: um chamado por mês de contrato (serviços reunidos), em vez de um por serviço');
  }
  State.contracts = (State.contracts || []).map(c => c.tecnicoIds ? c : ({ ...c, tecnicoIds: c.tecnicoId ? [c.tecnicoId] : [] }));
  State.contracts = (State.contracts || []).map(c => ({
    ...c,
    planos: (c.planos || []).map(p => p.tipos ? p : ({ tipos: p.tipo ? [p.tipo] : [], meses: p.meses || [] })),
  }));
  if(!State.adminUsers || State.adminUsers.length === 0){
    // Migração: cria um usuário administrador a partir da senha compartilhada anterior,
    // para que ninguém fique sem acesso ao trocar para o novo cadastro de usuários.
    State.adminUsers = [{ id: uid('usr'), nome: 'Administrador', email: '', senha: State.settings.adminPassword || 'admin123' }];
    await persist('adminUsers');
  }
}
function currentUserLabel(){
  if(!State.session) return 'Sistema';
  if(isAdmin()){
    const u = findById(State.adminUsers, State.session.userId);
    return 'Admin: ' + (u ? u.nome : 'Administrador');
  }
  if(isVisitante()) return 'Visitante';
  const tec = findById(State.technicians, State.session.tecnicoId);
  return 'Técnico: ' + (tec ? tec.nome : '—');
}
async function registrarLog(desc){
  if(!desc) return;
  State.logs = State.logs || [];
  State.logs.push({ ts: new Date().toISOString(), user: currentUserLabel(), desc });
  if(State.logs.length > 200) State.logs = State.logs.slice(State.logs.length - 200);
  try{ await window.storage.set('logs', JSON.stringify(State.logs), STORE_SHARED); }catch(e){ /* log é best-effort */ }
}
async function persistNow(key, logDesc, _isRetry, silent){
  try{
    await window.storage.set(key, JSON.stringify(State[key]), STORE_SHARED);
    if(key !== 'logs') await registrarLog(logDesc || ('Atualizou ' + key));
  }catch(e){
    console.error('Falha ao salvar', key, e);
    if(!_isRetry){
      await new Promise(r => setTimeout(r, 700));
      return persistNow(key, logDesc, true, silent);
    }
    if(!silent){
      showAlert('Não foi possível salvar as alterações agora (' + key + '). Verifique sua conexão e tente novamente em alguns instantes — se persistir, tente novamente mais tarde.');
    }
  }
}
/* Fila de gravações: cada chamada a persist() entra numa fila e as
   gravações continuam acontecendo uma de cada vez, nunca em paralelo —
   gravações simultâneas já causaram erro de armazenamento no passado
   (import de planilha). Mas, diferente de antes, quem chama persist() não
   precisa mais ESPERAR a gravação terminar para fechar a tela/atualizar a
   lista: a tela já reflete o estado em memória (já atualizado antes do
   persist) na hora, enquanto a gravação de verdade acontece em segundo
   plano, na fila. Isso é o que elimina a demora percebida depois de cada
   ação. Quem realmente precisa garantir que a gravação terminou (ex.:
   importação de planilha) continua podendo usar "await persist(...)".*/
let filaPersist = Promise.resolve();
function persist(key, logDesc, _isRetry, silent){
  const tarefa = filaPersist.then(() => persistNow(key, logDesc, _isRetry, silent));
  filaPersist = tarefa.catch(() => {}); // uma falha não deve travar as próximas gravações da fila
  return tarefa;
}
function uid(prefix){
  return prefix + '_' + Math.random().toString(36).slice(2,9);
}

/* ============ Atualização quase em tempo real ============
   Equipe pequena (até ~10 pessoas): busca só a coleção da tela
   aberta no momento, a cada 25s, e pausa quando a aba está em
   segundo plano — mantém a experiência "ao vivo" sem sobrecarregar
   o armazenamento. */
const POLL_INTERVAL_MS = 25000;
const VIEW_DATA_KEY = {
  calendario: 'appointments',
  ferramentas: 'tools',
  tecnicos: 'technicians',
  locais: 'locations',
  clientes: 'clients',
};
let pollTimer = null;

async function refreshCurrentViewData(){
  if(document.hidden || !State.session) return;
  // Se houver um modal aberto (cadastro/edição em andamento), não busca nem
  // substitui os dados agora: isso já causou perda de edições em andamento
  // (o modal segue com a referência antiga do registro, e ao salvar ela
  // acabava gravando por cima dos dados recém-buscados, descartando a
  // alteração em silêncio). Tenta de novo no próximo ciclo.
  if(document.getElementById('modal-backdrop')) return;
  const key = VIEW_DATA_KEY[State.view];
  if(!key) return;
  try{
    const r = await window.storage.get(key, STORE_SHARED);
    State[key] = r && r.value ? JSON.parse(r.value) : [];
    render();
  }catch(e){
    // falha silenciosa — tenta de novo no próximo ciclo
  }
}
function startPolling(){
  stopPolling();
  pollTimer = setInterval(refreshCurrentViewData, POLL_INTERVAL_MS);
}
function stopPolling(){
  if(pollTimer){ clearInterval(pollTimer); pollTimer = null; }
}
document.addEventListener('visibilitychange', () => {
  if(!document.hidden) refreshCurrentViewData();
});

/* ============ Backup ============ */
function downloadJSON(filename, dataObj){
  const blob = new Blob([JSON.stringify(dataObj, null, 2)], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function pruneBackups(keep){
  const dates = Object.keys(State.backups).sort();
  while(dates.length > keep){
    delete State.backups[dates.shift()];
  }
}

async function maybeCreateDailySnapshot(){
  const today = todayISO();
  if(State.backups[today]) return; // já existe um backup de hoje
  State.backups[today] = {
    tools: State.tools,
    technicians: State.technicians,
    locations: State.locations,
    clients: State.clients,
    appointments: State.appointments,
    criadoEm: new Date().toISOString(),
  };
  pruneBackups(7);
  try{
    await window.storage.set('backups', JSON.stringify(State.backups), STORE_SHARED);
  }catch(e){
    // Provavelmente o histórico ficou grande demais — reduz mais e tenta de novo,
    // sem incomodar o usuário com um aviso por causa de um recurso de segundo plano.
    console.error('Falha ao salvar backups, reduzindo histórico e tentando de novo', e);
    pruneBackups(3);
    try{
      await window.storage.set('backups', JSON.stringify(State.backups), STORE_SHARED);
    }catch(e2){
      console.error('Falha ao salvar backups mesmo após reduzir o histórico', e2);
    }
  }
}

/* ============ Permissões ============ */
function isAdmin(){ return !!State.session && State.session.role === 'admin'; }
function isTecnico(){ return !!State.session && State.session.role === 'tecnico'; }
function isVisitante(){ return !!State.session && State.session.role === 'visitante'; }
function canEditAppt(appt){
  if(isAdmin()) return true;
  if(isTecnico()) return appt.tecnicoId === State.session.tecnicoId;
  return false;
}
function getVisibleAppointments(){
  let list;
  if(isAdmin() || isVisitante() || State.calFilter === 'general') list = State.appointments;
  else list = State.appointments.filter(a => a.tecnicoId === State.session.tecnicoId);
  if(isAdmin() && State.calTecnicoFiltro) list = list.filter(a => a.tecnicoId === State.calTecnicoFiltro);
  return list;
}

/* ============ Helpers ============ */
const DOW = ['DOM','SEG','TER','QUA','QUI','SEX','SÁB'];
const MONTHS = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

function fmtDate(d){
  if(!d) return '—';
  const dt = new Date(d + 'T00:00:00');
  if(isNaN(dt.getTime())) return d;
  return dt.getDate().toString().padStart(2,'0') + '/' + (dt.getMonth()+1).toString().padStart(2,'0') + '/' + dt.getFullYear();
}
function todayISO(){
  return isoDate(new Date());
}
function isoDate(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function addDaysIso(iso, n){
  const d = new Date(iso + 'T00:00:00');
  d.setDate(d.getDate() + n);
  return isoDate(d);
}
function datesBetween(startIso, endIso){
  const dates = [];
  if(!startIso) return dates;
  let cur = new Date(startIso + 'T00:00:00');
  const end = new Date((endIso || startIso) + 'T00:00:00');
  if(isNaN(cur.getTime()) || isNaN(end.getTime()) || cur > end) return [startIso];
  while(cur <= end){
    dates.push(isoDate(cur));
    cur.setDate(cur.getDate() + 1);
  }
  return dates;
}
/* Converte data de planilha (padrão brasileiro DD/MM/AAAA, com - ou / como
   separador) para o formato interno AAAA-MM-DD. Aceita também datas que já
   vierem em AAAA-MM-DD. Se não reconhecer o formato, devolve o texto original
   sem alterar, para não descartar o dado. */
function toBRInputValue(iso){
  if(!iso) return '';
  const dt = new Date(iso + 'T00:00:00');
  if(isNaN(dt.getTime())) return iso;
  return String(dt.getDate()).padStart(2,'0') + '/' + String(dt.getMonth()+1).padStart(2,'0') + '/' + dt.getFullYear();
}
function bindBRDateMask(id){
  const el = document.getElementById(id);
  if(!el) return;
  el.addEventListener('input', () => {
    let v = el.value.replace(/\D/g,'').slice(0,8);
    if(v.length >= 5) v = v.slice(0,2) + '/' + v.slice(2,4) + '/' + v.slice(4);
    else if(v.length >= 3) v = v.slice(0,2) + '/' + v.slice(2);
    el.value = v;
  });
  // Por padrão, todo campo de data abre um calendário para seleção (além de
  // continuar aceitando digitação manual, que é o que a máscara acima faz).
  el.addEventListener('focus', () => abrirSeletorData(el));
  el.addEventListener('click', () => abrirSeletorData(el));
}

/* ---------- Seletor de data (calendário popup) ----------
   Abre, por padrão, sempre que um campo de data (ligado via
   bindBRDateMask) recebe foco ou é clicado — alternativa visual à
   digitação manual, que continua funcionando normalmente em paralelo.
   Só um seletor fica aberto por vez; dpState guarda o campo atual e os
   listeners que precisam ser removidos ao fechar. */
let dpState = null;

function fecharSeletorData(){
  if(!dpState) return;
  const popup = document.getElementById('dp-popup');
  if(popup) popup.remove();
  document.removeEventListener('mousedown', dpState.outsideHandler, true);
  document.removeEventListener('keydown', dpState.escHandler, true);
  dpState = null;
}

function abrirSeletorData(inputEl){
  if(dpState && dpState.inputEl === inputEl) return; // já aberto para este campo
  fecharSeletorData();

  const parsedIso = parseBRDate(inputEl.value);
  let anchor = parsedIso ? new Date(parsedIso + 'T00:00:00') : new Date();
  if(isNaN(anchor.getTime())) anchor = new Date();
  anchor = new Date(anchor.getFullYear(), anchor.getMonth(), 1);

  const popup = document.createElement('div');
  popup.id = 'dp-popup';
  popup.className = 'dp-popup';
  document.body.appendChild(popup);

  function posicionar(){
    const rect = inputEl.getBoundingClientRect();
    const popW = 236;
    let left = rect.left;
    const maxLeft = document.documentElement.clientWidth - popW - 8;
    if(left > maxLeft) left = Math.max(8, maxLeft);
    let top = rect.bottom + 4;
    const popH = popup.offsetHeight || 260;
    if(top + popH > window.innerHeight - 8) top = Math.max(8, rect.top - popH - 4);
    popup.style.left = left + 'px';
    popup.style.top = top + 'px';
  }

  function selecionarIso(iso){
    inputEl.value = toBRInputValue(iso);
    inputEl.dispatchEvent(new Event('input', { bubbles: true }));
    inputEl.dispatchEvent(new Event('change', { bubbles: true }));
    fecharSeletorData();
  }

  function renderPicker(){
    const year = anchor.getFullYear(), mo = anchor.getMonth();
    const firstOfMonth = new Date(year, mo, 1);
    const startOffset = firstOfMonth.getDay();
    const daysInMonth = new Date(year, mo+1, 0).getDate();
    const totalCells = Math.ceil((startOffset + daysInMonth) / 7) * 7;
    const today = todayISO();
    const selecionadoIso = parseBRDate(inputEl.value);

    let cellsHtml = DOW.map(d => `<div class="dp-dow">${d}</div>`).join('');
    for(let i=0;i<totalCells;i++){
      let dayNum, cellDate, outside = false;
      if(i < startOffset){
        dayNum = new Date(year, mo, 0).getDate() - startOffset + i + 1;
        cellDate = new Date(year, mo-1, dayNum);
        outside = true;
      } else if(i >= startOffset + daysInMonth){
        dayNum = i - startOffset - daysInMonth + 1;
        cellDate = new Date(year, mo+1, dayNum);
        outside = true;
      } else {
        dayNum = i - startOffset + 1;
        cellDate = new Date(year, mo, dayNum);
      }
      const iso = isoDate(cellDate);
      const classes = ['dp-cell'];
      if(outside) classes.push('outside');
      if(iso === today) classes.push('today');
      if(iso === selecionadoIso) classes.push('selected');
      cellsHtml += `<button type="button" class="${classes.join(' ')}" data-iso="${iso}">${dayNum}</button>`;
    }

    popup.innerHTML = `
      <div class="dp-head">
        <button type="button" class="dp-nav" id="dp-prev">‹</button>
        <div class="dp-label">${MONTHS[mo]} ${year}</div>
        <button type="button" class="dp-nav" id="dp-next">›</button>
      </div>
      <div class="dp-grid">${cellsHtml}</div>
      <div class="dp-foot">
        <button type="button" class="dp-foot-btn" id="dp-hoje">Hoje</button>
        <button type="button" class="dp-foot-btn" id="dp-limpar">Limpar</button>
      </div>
    `;
    popup.querySelectorAll('.dp-cell[data-iso]').forEach(btn => btn.addEventListener('click', () => selecionarIso(btn.dataset.iso)));
    popup.querySelector('#dp-prev').addEventListener('click', () => { anchor = new Date(year, mo-1, 1); renderPicker(); posicionar(); });
    popup.querySelector('#dp-next').addEventListener('click', () => { anchor = new Date(year, mo+1, 1); renderPicker(); posicionar(); });
    popup.querySelector('#dp-hoje').addEventListener('click', () => selecionarIso(todayISO()));
    popup.querySelector('#dp-limpar').addEventListener('click', () => {
      inputEl.value = '';
      inputEl.dispatchEvent(new Event('input', { bubbles: true }));
      inputEl.dispatchEvent(new Event('change', { bubbles: true }));
      fecharSeletorData();
    });
  }

  renderPicker();
  posicionar();

  const outsideHandler = (e) => {
    const popupEl = document.getElementById('dp-popup');
    if(popupEl && (popupEl.contains(e.target) || e.target === inputEl)) return;
    fecharSeletorData();
  };
  const escHandler = (e) => { if(e.key === 'Escape') fecharSeletorData(); };
  document.addEventListener('mousedown', outsideHandler, true);
  document.addEventListener('keydown', escHandler, true);
  dpState = { inputEl, outsideHandler, escHandler };
}
function bindBRLMask(id){
  const el = document.getElementById(id);
  if(!el) return;
  el.addEventListener('input', () => {
    let digits = el.value.replace(/\D/g,'');
    if(!digits){ el.value = ''; return; }
    digits = digits.replace(/^0+(?=\d)/, '');
    while(digits.length < 3) digits = '0' + digits;
    const centavos = digits.slice(-2);
    const reais = digits.slice(0, -2).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    el.value = 'R$ ' + reais + ',' + centavos;
  });
}
/* Formata um valor vindo de planilha (que pode chegar com ponto como decimal,
   ex.: "54673.22", dependendo de como a célula foi lida) para o padrão
   brasileiro, com vírgula como separador decimal — ex.: "R$ 54.673,22". */
function formatBRL(val){
  if(val === null || val === undefined) return '';
  let str = val.toString().trim();
  if(!str) return '';
  if(/,\d{2}$/.test(str)) return str.startsWith('R$') ? str : 'R$ ' + str;
  const num = parseFloat(str.replace(/[^\d.-]/g, ''));
  if(isNaN(num)) return str;
  return 'R$ ' + num.toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
}
function parseBRDate(str){
  str = (str || '').toString().trim();
  if(!str) return '';
  if(/^\d{4}-\d{2}-\d{2}$/.test(str)) return str;
  const m = str.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
  if(m){
    let [, d, mo, y] = m;
    if(y.length === 2) y = (Number(y) <= 69 ? '20' : '19') + y;
    return y + '-' + mo.padStart(2,'0') + '-' + d.padStart(2,'0');
  }
  // Célula de data "de verdade" no Excel vira um número de série (dias desde
  // 1899-12-30) em vez de texto — converte esse número para AAAA-MM-DD.
  if(/^\d+(\.\d+)?$/.test(str)){
    const serial = parseFloat(str);
    if(serial > 0){
      const utcMs = Math.round((serial - 25569) * 86400 * 1000);
      const d = new Date(utcMs);
      if(!isNaN(d.getTime())){
        return isoDate(new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()));
      }
    }
  }
  return str;
}
/* Lê a data direto do valor "cru" da célula da planilha (objeto Date do
   Excel, ou número de série), sem passar por nenhuma formatação de texto
   no meio do caminho — evita qualquer ambiguidade de padrão americano
   vs. brasileiro. Cai para o texto (parseBRDate) só se não for nem
   Date nem número. */
function extractCellDate(rawVal, textVal){
  if(rawVal instanceof Date && !isNaN(rawVal.getTime())){
    return isoDate(new Date(rawVal.getFullYear(), rawVal.getMonth(), rawVal.getDate()));
  }
  if(typeof rawVal === 'number' && rawVal > 0){
    const utcMs = Math.round((rawVal - 25569) * 86400 * 1000);
    const d = new Date(utcMs);
    if(!isNaN(d.getTime())) return isoDate(new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()));
  }
  return parseBRDate(textVal);
}
function startOfWeek(date, util){
  const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
  const day = d.getDay(); // 0 = domingo
  const diff = util ? (day === 0 ? -6 : 1 - day) : -day;
  d.setDate(d.getDate() + diff);
  return d;
}
function findById(list, id){ return list.find(x => x.id === id); }
function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* Cor fixa por técnico (determinística, sem precisar guardar nada) —
   ajuda o administrador a diferenciar quem é quem no calendário. */
const TECNICO_PALETTE = ['#2B6777','#B9812F','#6B3FA0','#2B6B95','#3F7D4C','#B23A2E','#9C7A1F','#6B7680','#1E4B57','#8A4FB8'];
function getTecnicoColor(tecnicoId){
  if(!tecnicoId) return 'transparent';
  const tec = findById(State.technicians, tecnicoId);
  if(tec && tec.cor) return tec.cor;
  let hash = 0;
  for(let i=0;i<tecnicoId.length;i++) hash = (hash*31 + tecnicoId.charCodeAt(i)) >>> 0;
  return TECNICO_PALETTE[hash % TECNICO_PALETTE.length];
}

/* Nome usado para exibir um cliente na agenda — prioriza o Nome Fantasia

function clienteNomeAgenda(cliente){

/* ============ Status de Padrão/Ferramenta (cores por vencimento e situação) ============
   Prioridade: Vencida > Em calibração > Indisponível > Transferida/fora do local
   > avisos de vencimento (3/2/1 mês) > Disponível. */
/* ============ Seleção em lote (só administrador) ============ */
/* ============ Ordenação padronizada (clique no cabeçalho) ============ */
function getTableSort(key, defaultCampo){
  return State.tableSort[key] || {campo: defaultCampo, dir: 'asc'};
}
function sortArrow(key, campo, defaultCampo){
  const sort = getTableSort(key, defaultCampo);
  return sort.campo === campo ? (sort.dir === 'asc' ? ' ▲' : ' ▼') : '';
}
function sortTh(key, campo, label, defaultCampo, extraAttrs){
  return `<th class="sortable" data-sort-key="${key}" data-sort-campo="${campo}"${extraAttrs||''}>${label}${sortArrow(key, campo, defaultCampo)}</th>`;
}
function sortList(list, key, defaultCampo, valueFn){
  const sort = getTableSort(key, defaultCampo);
  return list.slice().sort((a, b) => {
    const av = valueFn(a, sort.campo), bv = valueFn(b, sort.campo);
    if(av < bv) return sort.dir === 'asc' ? -1 : 1;
    if(av > bv) return sort.dir === 'asc' ? 1 : -1;
    return 0;
  });
}

function getSelection(key){

const BULK_DELETE_MAP = {
  tools: { stateKey: 'tools', label: 'padrão(ões)' },

async function bulkDelete(key){

function getPadraoStatus(t){
  const oficinaAtualId = t.oficinaAtualId || t.localUsoId;
  const foraDoLocal = !!(t.localUsoId && oficinaAtualId && oficinaAtualId !== t.localUsoId);
  let diffDays = null;
  if(t.vencimento){
    diffDays = Math.floor((new Date(t.vencimento + 'T00:00:00') - new Date(todayISO() + 'T00:00:00')) / 86400000);
  }
  if(diffDays !== null && diffDays < 0) return { label: 'Vencida', cls: 'nok' };
  if(t.status === 'Em calibração') return { label: 'Em calibração', cls: 'azul' };
  if(t.status === 'Indisponível') return { label: 'Indisponível', cls: 'cinza' };
  if(t.status === 'Transferida' || foraDoLocal) return { label: 'Transferida', cls: 'roxo' };
  if(diffDays !== null){
    if(diffDays <= 30) return { label: 'Vence em breve', cls: 'nok' };
    if(diffDays <= 60) return { label: 'Vence em 2 meses', cls: 'laranja' };
    if(diffDays <= 90) return { label: 'Vence em 3 meses', cls: 'amarelo' };
  }
  return { label: 'Disponível', cls: 'ok' };
}

function timesOverlap(aStart, aEnd, bStart, bEnd){
  return aStart < bEnd && bStart < aEnd;
}

/* ============ Status de Contrato (avisos de vencimento por cor) ============
   Mesma lógica de cores dos padrões (3/2/1 mês), mais os estados
   administrativos Suspenso/Cancelado que têm prioridade sobre o vencimento. */
/* Um contrato pode ter mais de um técnico vinculado (tecnicoIds). O campo
   antigo "tecnicoId" (um só) é mantido em sincronia como o primeiro/técnico
   principal, para não quebrar código que ainda lê só esse campo (ex.:
   geração automática de pendências do contrato). */
function contratoTecnicoIds(c){
  return (c.tecnicoIds && c.tecnicoIds.length) ? c.tecnicoIds : (c.tecnicoId ? [c.tecnicoId] : []);
}
function contratoTecnicosNomes(c){
  return contratoTecnicoIds(c).map(id => (findById(State.technicians, id) || {}).nome).filter(Boolean).join(', ');
}
function getContratoStatus(c){
  if(c.status === 'Suspenso') return { label: 'Suspenso', cls: 'cinza' };
  if(c.status === 'Cancelado') return { label: 'Cancelado', cls: 'cinza' };
  if(!c.vencimento) return { label: 'No Prazo', cls: 'ok' };
  const diffDays = Math.floor((new Date(c.vencimento + 'T00:00:00') - new Date(todayISO() + 'T00:00:00')) / 86400000);
  if(diffDays < 0) return { label: 'Vencido', cls: 'nok' };
  if(diffDays <= 30) return { label: 'Em Risco', cls: 'nok' };
  if(diffDays <= 60) return { label: 'Em Risco', cls: 'laranja' };
  if(diffDays <= 90) return { label: 'No Prazo', cls: 'amarelo' };
  return { label: 'No Prazo', cls: 'ok' };
}

/* ============ Status de Pendência/Chamado ============
   Não Agendado (sem data) -> Agendado NOK (data marcada) -> Agendado OK
   (confirmado) -> Atendido (data agendada já passou, sem conferência do sistema). */
function getPendenciaStatus(p){
  if(!p.dataAgendada) return { label: 'Não Agendado', cls: 'cinza' };
  const fim = p.dataAgendadaFim || p.dataAgendada;
  if(fim < todayISO()) return { label: 'Atendido', cls: 'azul' };
  return p.confirmado ? { label: 'Agendado OK', cls: 'ok' } : { label: 'Agendado NOK', cls: 'nok' };
}
/* Ícone de confirmação de agenda (atendimento ou chamado): check verde
   quando confirmado, exclamação em triângulo amarelo quando ainda não —
   substitui a antiga bolinha colorida nesse contexto específico de
   "Confirmado/Não confirmado" (demais badges de status, como ART ou
   vencimento de contrato, continuam com a bolinha). */
function statusConfirmIcon(confirmado){

    ? '<svg class="status-icon" width="13" height="13" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Confirmado"><circle cx="8" cy="8" r="8" fill="#3F7D4C"/><path d="M4.5 8.3L6.8 10.6L11.6 5.5" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>'
    : '<svg class="status-icon" width="13" height="13" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Não confirmado"><path d="M8 1.3L15.3 14.3C15.6 14.9 15.2 15.6 14.5 15.6H1.5C0.8 15.6 0.4 14.9 0.7 14.3L8 1.3Z" fill="#F2BB05" stroke="#8A6D1F" stroke-width="0.6"/><rect x="7.2" y="5.7" width="1.6" height="4.3" rx="0.8" fill="#3A2E0A"/><rect x="7.2" y="11.2" width="1.6" height="1.6" rx="0.8" fill="#3A2E0A"/></svg>';
}
/* Para badges que usam a bolinha genérica (cinza/azul/roxo/etc.), troca só
   quando a classe for especificamente "ok" ou "nok" (confirmação de
   agenda); nos demais casos mantém a bolinha original. */
function dotOuIconeConfirmacao(cls){
  if(cls === 'ok') return statusConfirmIcon(true);
  if(cls === 'nok') return statusConfirmIcon(false);
  return '<span class="dot"></span>';
}

/* Uma pendência/chamado vindo de contrato pode reunir mais de um serviço
   do plano de manutenção no mesmo mês (ex.: Calibração + MP) num único
   registro ("servicos", lista de chaves de PLANO_TIPOS) — por pedido do
   Guilherme, para ter só UM chamado e UM gerenciamento por mês/contrato,
   em vez de um chamado por serviço. Chamados manuais continuam com um
   único "servico" (texto livre, tipo cadastrado em Tipos de Serviço). */
function pendenciaServicosArray(p){
  if(p.servicos && p.servicos.length) return p.servicos;
  return p.servico ? [p.servico] : [];
}
function pendenciaServicoLabel(p){
  const arr = pendenciaServicosArray(p);
  return arr.length ? arr.join(' + ') : '—';
}
function pendenciaPlanoLabel(p){
  if(p.origem !== 'contrato') return p.planoManutencao || '—';
  const arr = pendenciaServicosArray(p);
  return arr.length ? arr.map(t => PLANO_TIPOS[t] || t).join(' · ') : '—';
}

function findConflicts(appt){
  const conflicts = [];
  const apptTools = appt.ferramentaIds || [];
  for(const other of State.appointments){
    if(other.id === appt.id) continue;
    const apptFim = appt.dataFim || appt.data;
    const otherFim = other.dataFim || other.data;
    if(!(appt.data <= otherFim && other.data <= apptFim)) continue;
    if(!timesOverlap(appt.horaInicio, appt.horaFim, other.horaInicio, other.horaFim)) continue;
    const otherTools = other.ferramentaIds || [];
    apptTools.filter(id => otherTools.includes(id)).forEach(id => {
      const tool = findById(State.tools, id);
      conflicts.push('Ferramenta ' + (tool?.ferramentaId || '') + ' já alocada das ' + other.horaInicio + ' às ' + other.horaFim + ' (' + buildTitle(other) + ')');
    });
    if(appt.tecnicoId && other.tecnicoId === appt.tecnicoId){
      conflicts.push('Técnico ' + (findById(State.technicians, appt.tecnicoId)?.nome || '') + ' já escalado das ' + other.horaInicio + ' às ' + other.horaFim + ' (' + buildTitle(other) + ')');
    }
  }
  return conflicts;
}

function renderAcessos(){
  let backupList = Object.keys(State.backups || {}).map(d => {
    const b = State.backups[d];
    return { date: d, total: (b.tools?.length||0) + (b.technicians?.length||0) + (b.locations?.length||0) + (b.clients?.length||0) + (b.appointments?.length||0) };
  });
  const backupsSortedByUser = !!State.tableSort.backups;
  backupList = sortList(backupList, 'backups', 'date', (b, campo) => b[campo]);
  if(!backupsSortedByUser) backupList.reverse(); // padrão: mais recente primeiro
  const dates = backupList.map(b => b.date);
  const backupRows = backupList.map(({date: d, total}) => {
    return `<tr>
      <td>${fmtDate(d)}</td>
      <td>${total} registro(s)</td>
      <td>
        <div class="row-actions">
          <button class="icon-btn" data-view-backup="${d}">Ver</button>
          <button class="icon-btn" data-download-backup="${d}">Baixar</button>
          <button class="icon-btn danger" data-restore-backup="${d}">Restaurar</button>
          <button class="icon-btn danger" data-del-backup="${d}">Remover</button>
        </div>
      </td>
    </tr>`;
  }).join('');

  const adminList = sortList(State.adminUsers, 'adminUsers', 'nome', (u, campo) => (u[campo]||'').toString().toLowerCase());
  const adminRows = adminList.map(u => `<tr data-admin-row="${u.id}">
    <td>${escapeHtml(u.nome)}</td>
    <td>${u.email ? escapeHtml(u.email) : '<span style="color:var(--muted)">—</span>'}</td>
    <td>
      <div class="row-actions">
        <button class="icon-btn" data-reset-admin="${u.id}">Redefinir senha</button>
        <button class="icon-btn" data-edit-admin="${u.id}">Editar</button>
        ${State.adminUsers.length > 1 ? `<button class="icon-btn danger" data-del-admin="${u.id}">Remover</button>` : ''}
      </div>
    </td>
  </tr>`).join('');

  const logFiltro = State.logFiltro || {};
  let logsFiltrados = (State.logs || []).slice();
  if(logFiltro.de) logsFiltrados = logsFiltrados.filter(l => isoDate(new Date(l.ts)) >= logFiltro.de);
  if(logFiltro.ate) logsFiltrados = logsFiltrados.filter(l => isoDate(new Date(l.ts)) <= logFiltro.ate);
  if(logFiltro.quem) logsFiltrados = logsFiltrados.filter(l => l.user.toLowerCase().includes(logFiltro.quem.toLowerCase()));
  if(logFiltro.acao) logsFiltrados = logsFiltrados.filter(l => l.desc.toLowerCase().includes(logFiltro.acao.toLowerCase()));
  logsFiltrados.reverse(); // mais recentes primeiro

  const gruposPorData = {};
  logsFiltrados.forEach(l => {
    const d = isoDate(new Date(l.ts));
    (gruposPorData[d] = gruposPorData[d] || []).push(l);
  });
  const datasOrdenadas = Object.keys(gruposPorData).sort().reverse();

  const logGroupsHtml = datasOrdenadas.map(d => {
    const entries = gruposPorData[d];
    const aberto = State.logExpanded.has(d);
    const rows = entries.map(l => {
      const hora = new Date(l.ts).toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
      return `<tr>
        <td style="white-space:nowrap; font-size:12px; width:60px;">${escapeHtml(hora)}</td>
        <td style="font-size:12px;">${escapeHtml(l.user)}</td>
        <td style="font-size:12px;">${escapeHtml(l.desc)}</td>
      </tr>`;
    }).join('');
    return `
      <div class="log-group">
        <button type="button" class="log-group-head" data-log-toggle="${d}">
          <span class="log-group-chevron ${aberto?'open':''}">›</span>
          <span class="log-group-date">${escapeHtml(fmtDate(d))}</span>
          <span class="log-group-count">${entries.length} ação(ões)</span>
        </button>
        ${aberto ? `
          <table class="log-group-table">
            <thead><tr><th style="width:60px;">Hora</th><th>Responsável</th><th>Ação</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        ` : ''}
      </div>
    `;
  }).join('');

  return `
    <h3 style="margin-bottom:10px; font-size:14px;">Usuários administrativos</h3>
    <div class="toolbar" style="margin-bottom:10px;">
      <div class="toolbar-left"><span style="font-size:12.5px;color:var(--muted)">${State.adminUsers.length} administrador(es)</span></div>
      <button class="btn" id="btn-new-admin">+ Novo administrador</button>
    </div>
    <div class="panel" style="max-width:560px;">
      <table>
        <thead><tr>${sortTh('adminUsers','nome','Nome','nome')}${sortTh('adminUsers','email','E-mail','nome')}<th></th></tr></thead>
        <tbody>${adminRows}</tbody>
      </table>
    </div>
    <div class="hint" style="margin-top:10px; max-width:560px;">
      O PIN de cada técnico é definido no cadastro, em "Técnicos" (inclui campo de oficina e ação de "Redefinir PIN"). Este controle organiza o uso em equipe; não é uma proteção forte contra acesso mal-intencionado.
    </div>

    <h3 style="margin-top:30px; margin-bottom:10px; font-size:14px;">Base completa (migração entre ambientes)</h3>
    <div class="toolbar" style="margin-bottom:10px;">
      <div class="toolbar-left"><span style="font-size:12.5px;color:var(--muted)">Exporta/importa todos os cadastros, contratos, pendências e acessos — use para migrar os dados entre o Claude.ai e uma versão publicada (ex.: GitHub Pages), ou como cópia de segurança completa.</span></div>
      <div style="display:flex; gap:8px;">
        <button class="btn secondary" id="btn-export-tudo">Exportar base completa (.json)</button>
        <button class="btn secondary" id="btn-import-tudo">Importar base completa (.json)</button>
        <input type="file" id="input-import-tudo" accept="application/json" style="display:none;">
      </div>
    </div>
    <div class="hint" style="margin-top:-2px; margin-bottom:10px; max-width:560px;">
      Importar substitui TODOS os dados atuais (ferramentas, técnicos, locais, clientes, contratos, pendências, tipos de serviço e acessos) pelos dados do arquivo — não pode ser desfeito.
    </div>

    <h3 style="margin-top:30px; margin-bottom:10px; font-size:14px;">Backup</h3>
    <div class="toolbar" style="margin-bottom:10px;">
      <div class="toolbar-left"><span style="font-size:12.5px;color:var(--muted)">Uma cópia é criada automaticamente no primeiro acesso de cada dia. ${dates.length} backup(s) guardado(s) (últimos 7 dias).</span></div>
      <button class="btn secondary" id="btn-download-now">Baixar backup agora</button>
    </div>
    <div class="panel" style="max-width:560px;">
      ${dates.length === 0 ? `
        <div class="empty-state">
          <div class="big">Nenhum backup automático ainda</div>
          Um backup será criado automaticamente na próxima vez que alguém abrir o sistema.
        </div>` : `
        <table>
          <thead><tr>${sortTh('backups','date','Data','date')}${sortTh('backups','total','Conteúdo','date')}<th></th></tr></thead>
          <tbody>${backupRows}</tbody>
        </table>`}
    </div>
    <div class="hint" style="margin-top:10px; max-width:560px;">
      Restaurar um backup substitui todos os dados atuais (ferramentas, técnicos, locais, clientes e agendamentos) pelos dados salvos naquele dia — não pode ser desfeito.
    </div>

    <h3 style="margin-top:30px; margin-bottom:10px; font-size:14px;">Log de ações</h3>
    <div class="toolbar" style="margin-bottom:10px;">
      <div class="toolbar-left"><span style="font-size:12.5px;color:var(--muted)">${(State.logs||[]).length} registro(s) no total · ${logsFiltrados.length} exibido(s)</span></div>
      ${(State.logs||[]).length > 0 ? '<button class="btn secondary" id="btn-clear-log">Limpar log</button>' : ''}
    </div>
    <div class="hint" style="margin-top:-2px; margin-bottom:12px;">Versão desta aplicação: <span class="mono">${escapeHtml(APP_VERSION)}</span></div>
    <div style="display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap; margin-bottom:12px;">
      <div class="field" style="margin:0;">
        <label for="lf-de" style="font-size:11px;">De</label>
        <input type="text" id="lf-de" value="${toBRInputValue(logFiltro.de)}" placeholder="DD/MM/AAAA" maxlength="10" style="padding:6px 8px; font-size:12.5px;">
      </div>
      <div class="field" style="margin:0;">
        <label for="lf-ate" style="font-size:11px;">Até</label>
        <input type="text" id="lf-ate" value="${toBRInputValue(logFiltro.ate)}" placeholder="DD/MM/AAAA" maxlength="10" style="padding:6px 8px; font-size:12.5px;">
      </div>
      <div class="field" style="margin:0;">
        <label for="lf-quem" style="font-size:11px;">Responsável</label>
        <input type="text" id="lf-quem" value="${escapeHtml(logFiltro.quem || '')}" placeholder="Filtrar por nome" style="padding:6px 8px; font-size:12.5px;">
      </div>
      <div class="field" style="margin:0;">
        <label for="lf-acao" style="font-size:11px;">Ação</label>
        <input type="text" id="lf-acao" value="${escapeHtml(logFiltro.acao || '')}" placeholder="Filtrar por ação" style="padding:6px 8px; font-size:12.5px;">
      </div>
      <button class="btn secondary small" id="lf-limpar">Limpar filtros</button>
    </div>
    ${datasOrdenadas.length === 0 ? `
      <div class="panel"><div class="empty-state"><div class="big">Nenhuma ação encontrada</div></div></div>
    ` : logGroupsHtml}
    <div class="hint" style="margin-top:10px;">Clique numa data para ver as ações daquele dia. O sistema guarda um histórico das últimas 200 ações.</div>
  `;
}

function renderCrudSimples(view){

    cfg.columns.some(c => (c.render ? c.render(item) : (item[c.k]||'')).toString().toLowerCase().includes(filtro))
  );
  const colKey = (c, idx) => c.k || ('col' + idx);
  const defaultCampo = colKey(cfg.columns.find(c => !c.raw) || cfg.columns[0], cfg.columns.indexOf(cfg.columns.find(c => !c.raw) || cfg.columns[0]));
  list = sortList(list, view, defaultCampo, (item, campo) => {
    const idx = cfg.columns.findIndex((c, i) => colKey(c, i) === campo);

  return `
    <div class="toolbar">
      <div class="toolbar-left"><span style="font-size:12.5px;color:var(--muted)">${list.length} de ${fullList.length} ${fullList.length===1?cfg.label:cfg.labelPlural}</span></div>

      ${list.length === 0 ? `
        <div class="empty-state">
          <div class="big">Nenhum ${cfg.label} encontrado</div>
          ${fullList.length === 0 ? 'Cadastre para usá-lo nos formulários de ferramentas e agendamentos.' : 'Ajuste a busca ou limpe o filtro.'}
        </div>` : `
        <table>
          <thead><tr>${renderSelectAllHeader(view, list.map(i=>i.id))}${cfg.columns.map((c,idx)=> c.raw ? `<th>${c.h}</th>` : sortTh(view, colKey(c,idx), c.h, defaultCampo)).join('')}<th></th></tr></thead>

function buildApptsByDate(){
  const apptsByDate = {};
  getVisibleAppointments().forEach(a => {
    datesBetween(a.data, a.dataFim || a.data).forEach(iso => {
      (apptsByDate[iso] = apptsByDate[iso] || []).push(a);
    });
  });
  Object.values(apptsByDate).forEach(list => list.sort((a,b)=>a.horaInicio.localeCompare(b.horaInicio)));
  return apptsByDate;
}

/* Chamados/pendências que já têm uma data agendada (arrastados ou definidos
   manualmente no formulário) também precisam aparecer no calendário — do
   contrário o arrastar-e-soltar da lista de pendências para a agenda não
   tem efeito visual nenhum, mesmo gravando a data corretamente. */
function getVisibleScheduledPendencias(){
  let list = State.pendencias.filter(p => p.dataAgendada);
  if(!(isAdmin() || isVisitante() || State.calFilter === 'general')){
    list = list.filter(p => p.tecnicoId === State.session.tecnicoId);
  }
  if(isAdmin() && State.calTecnicoFiltro) list = list.filter(p => p.tecnicoId === State.calTecnicoFiltro);
  return list;
}
function buildPendByDate(){
  const pendByDate = {};
  getVisibleScheduledPendencias().forEach(p => {
    datesBetween(p.dataAgendada, p.dataAgendadaFim || p.dataAgendada).forEach(iso => {
      (pendByDate[iso] = pendByDate[iso] || []).push(p);
    });
  });
  return pendByDate;
}
function podeGerenciarPendencia(p){
  return isAdmin() || (isTecnico() && p.tecnicoId === State.session.tecnicoId);
}

/* ============ Exportar agenda (.ics) ============
   Gera, inteiramente no navegador (nada é enviado pra fora), um
   arquivo no formato iCalendar (.ics) — padrão aberto aceito por
   Google Agenda, Outlook, Apple Calendar etc. — com os atendimentos e
   chamados agendados que estão visíveis na tela no momento (respeita
   os mesmos filtros já aplicados: minha agenda/agenda geral, técnico
   selecionado). O usuário importa esse arquivo manualmente na
   plataforma que preferir. Primeiro passo simples antes de uma
   integração automática de verdade com as APIs do Google/Microsoft. */
function escapeICS(txt){
  return String(txt || '').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
}
function dataICS(iso){
  return (iso || '').replace(/-/g,'');
}
function horaICS(iso, hhmm){
  return (iso || '').replace(/-/g,'') + 'T' + (hhmm || '00:00').replace(':','') + '00';
}
function exportarAgendaICS(){
  const linhas = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Painel de Campo//Agenda//PT-BR', 'CALSCALE:GREGORIAN'];
  const agora = new Date().toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
  let totalEventos = 0;

  getVisibleAppointments().forEach(a => {
    const cliente = findById(State.clients, a.clienteId);
    const tec = findById(State.technicians, a.tecnicoId);
    const descPartes = [
      cliente ? 'Cliente: ' + clienteNomeAgenda(cliente) : '',
      tec ? 'Técnico: ' + tec.nome : '',
      a.observacoes ? 'Observações: ' + a.observacoes : '',
    ].filter(Boolean);
    linhas.push('BEGIN:VEVENT');
    linhas.push('UID:appt-' + a.id + '@painel-de-campo');
    linhas.push('DTSTAMP:' + agora);
    if(a.diaTodo){
      linhas.push('DTSTART;VALUE=DATE:' + dataICS(a.data));
      linhas.push('DTEND;VALUE=DATE:' + dataICS(addDaysIso(a.dataFim || a.data, 1)));
    } else {
      linhas.push('DTSTART:' + horaICS(a.data, a.horaInicio));
      linhas.push('DTEND:' + horaICS(a.dataFim || a.data, a.horaFim || a.horaInicio));
    }
    linhas.push('SUMMARY:' + escapeICS(buildTitle(a)));
    if(a.cidade) linhas.push('LOCATION:' + escapeICS(a.cidade));
    if(descPartes.length) linhas.push('DESCRIPTION:' + escapeICS(descPartes.join('\n')));
    linhas.push('STATUS:' + (a.status === 'OK' ? 'CONFIRMED' : 'TENTATIVE'));
    linhas.push('END:VEVENT');
    totalEventos++;
  });

  getVisibleScheduledPendencias().forEach(p => {
    const cliente = findById(State.clients, p.clienteId);
    const tec = findById(State.technicians, p.tecnicoId);
    const descPartes = [
      cliente ? 'Cliente: ' + clienteNomeAgenda(cliente) : '',
      tec ? 'Técnico: ' + tec.nome : '',
      p.observacoes ? 'Observações: ' + p.observacoes : '',
    ].filter(Boolean);
    linhas.push('BEGIN:VEVENT');
    linhas.push('UID:pend-' + p.id + '@painel-de-campo');
    linhas.push('DTSTAMP:' + agora);
    linhas.push('DTSTART;VALUE=DATE:' + dataICS(p.dataAgendada));
    linhas.push('DTEND;VALUE=DATE:' + dataICS(addDaysIso(p.dataAgendadaFim || p.dataAgendada, 1)));
    linhas.push('SUMMARY:' + escapeICS(buildTituloPendencia(p)));
    if(p.cidade) linhas.push('LOCATION:' + escapeICS(p.cidade));
    if(descPartes.length) linhas.push('DESCRIPTION:' + escapeICS(descPartes.join('\n')));
    linhas.push('STATUS:' + (p.confirmado ? 'CONFIRMED' : 'TENTATIVE'));
    linhas.push('END:VEVENT');
    totalEventos++;
  });

  linhas.push('END:VCALENDAR');

  if(totalEventos === 0){
    showAlert('Não há nada agendado para exportar (com os filtros atuais da tela).');
    return;
  }

  const conteudo = linhas.join('\r\n');
  const blob = new Blob([conteudo], { type: 'text/calendar;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'agenda-painel-de-campo-' + todayISO() + '.ics';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
/* ============ Sincronizar com o Outlook (Microsoft Graph) ============
   Envia a agenda visível na tela para um calendário próprio chamado
   "Painel de Campo" dentro do Outlook da pessoa. É uma via de mão única
   (Painel -> Outlook): a cada sincronização o conteúdo desse calendário
   é substituído pelo que está na tela agora, então ele não deve ser
   usado para compromissos pessoais. Login Microsoft feito aqui mesmo no
   navegador (OAuth com PKCE), sem servidor nosso no meio. Só disponível
   na versão hospedada (precisa de um endereço próprio para o retorno do
   login). Requer o "ID do aplicativo" registrado no Azure — ver
   OUTLOOK_CLIENT_ID. */
const OUTLOOK_CLIENT_ID = '';
const OUTLOOK_NOME_CALENDARIO = 'Painel de Campo';
const OUTLOOK_FUSO = 'America/Sao_Paulo';
let outlookToken = null; // { valor, expiraEm }

function base64Url(bytes){
  let s = '';
  bytes.forEach(b => { s += String.fromCharCode(b); });
  return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
async function outlookGerarPKCE(){
  const rnd = crypto.getRandomValues(new Uint8Array(48));
  const verifier = base64Url(rnd);
  const hash = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier));
  return { verifier, challenge: base64Url(new Uint8Array(hash)) };
}
function outlookRedirectUri(){ return location.origin + location.pathname; }
async function outlookObterToken(){
  if(outlookToken && outlookToken.expiraEm > Date.now() + 60000) return outlookToken.valor;
  const { verifier, challenge } = await outlookGerarPKCE();
  const estado = base64Url(crypto.getRandomValues(new Uint8Array(16)));
  const escopo = 'https://graph.microsoft.com/Calendars.ReadWrite';
  const url = 'https://login.microsoftonline.com/common/oauth2/v2.0/authorize?' + new URLSearchParams({
    client_id: OUTLOOK_CLIENT_ID, response_type: 'code', redirect_uri: outlookRedirectUri(),
    response_mode: 'fragment', scope: escopo, code_challenge: challenge,
    code_challenge_method: 'S256', state: estado, prompt: 'select_account',
  }).toString();
  const popup = window.open(url, 'outlook-login', 'width=520,height=680');
  if(!popup) throw new Error('O navegador bloqueou a janela de login. Libere pop-ups para este site e tente de novo.');
  // Quando a Microsoft devolve para o nosso endereço, a janela vira "mesma origem"
  // e conseguimos ler o código no final do endereço.
  const codigo = await new Promise((resolve, reject) => {
    const inicio = Date.now();
    const t = setInterval(() => {
      if(popup.closed){ clearInterval(t); reject(new Error('Login cancelado.')); return; }
      if(Date.now() - inicio > 180000){ clearInterval(t); try{ popup.close(); }catch(e){} reject(new Error('Tempo esgotado no login.')); return; }
      try{
        const h = popup.location.hash || '';
        if(popup.location.origin === location.origin && /[#&](code|error)=/.test(h)){
          const p = new URLSearchParams(h.replace(/^#/, ''));
          clearInterval(t); popup.close();
          if(p.get('error')) reject(new Error(p.get('error_description') || p.get('error')));
          else if(p.get('state') !== estado) reject(new Error('Resposta de login inválida.'));
          else resolve(p.get('code'));
        }
      }catch(e){ /* ainda no domínio da Microsoft — aguarda */ }
    }, 300);
  });
  const resp = await fetch('https://login.microsoftonline.com/common/oauth2/v2.0/token', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams({
      client_id: OUTLOOK_CLIENT_ID, grant_type: 'authorization_code', code: codigo,
      redirect_uri: outlookRedirectUri(), code_verifier: verifier, scope: escopo,
    }).toString(),
  });
  const dados = await resp.json();
  if(!resp.ok || !dados.access_token) throw new Error(dados.error_description || 'Não foi possível concluir o login Microsoft.');
  outlookToken = { valor: dados.access_token, expiraEm: Date.now() + (dados.expires_in || 3600) * 1000 };
  return outlookToken.valor;
}
async function graphFetch(token, caminho, opcoes){
  const resp = await fetch(caminho.startsWith('http') ? caminho : 'https://graph.microsoft.com/v1.0' + caminho, {
    ...opcoes,
    headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json', ...((opcoes && opcoes.headers) || {}) },
  });
  if(!resp.ok){
    let detalhe = '';
    try{ detalhe = (await resp.json()).error.message; }catch(e){}
    throw new Error('Microsoft respondeu ' + resp.status + (detalhe ? ': ' + detalhe : ''));
  }
  return resp.status === 204 ? null : resp.json();
}
async function graphBatch(token, requisicoes){
  for(let i = 0; i < requisicoes.length; i += 20){
    const fatia = requisicoes.slice(i, i + 20).map((r, j) => ({ id: String(j + 1), ...r }));
    const res = await graphFetch(token, '/$batch', { method: 'POST', body: JSON.stringify({ requests: fatia }) });
    const falhas = (res.responses || []).filter(r => r.status >= 400 && r.status !== 404);
    if(falhas.length) throw new Error('Alguns itens não foram aceitos pelo Outlook (' + falhas[0].status + ').');
  }
}
function coletarEventosOutlook(){
  const eventos = [];
  const corpo = (cliente, tec, obs) => [
    cliente ? 'Cliente: ' + clienteNomeAgenda(cliente) : '',
    tec ? 'Técnico: ' + tec.nome : '',
    obs ? 'Observações: ' + obs : '',
  ].filter(Boolean).join('\n');
  getVisibleAppointments().forEach(a => {
    const diaTodo = !!a.diaTodo;
    eventos.push({
      subject: buildTitle(a),
      body: { contentType: 'text', content: corpo(findById(State.clients, a.clienteId), findById(State.technicians, a.tecnicoId), a.observacoes) },
      isAllDay: diaTodo,
      start: { dateTime: diaTodo ? a.data + 'T00:00:00' : a.data + 'T' + (a.horaInicio || '00:00') + ':00', timeZone: OUTLOOK_FUSO },
      end: { dateTime: diaTodo ? addDaysIso(a.dataFim || a.data, 1) + 'T00:00:00' : (a.dataFim || a.data) + 'T' + (a.horaFim || a.horaInicio || '00:00') + ':00', timeZone: OUTLOOK_FUSO },
      location: a.cidade ? { displayName: a.cidade } : undefined,
      showAs: a.status === 'OK' ? 'busy' : 'tentative',
    });
  });
  getVisibleScheduledPendencias().forEach(p => {
    eventos.push({
      subject: buildTituloPendencia(p),
      body: { contentType: 'text', content: corpo(findById(State.clients, p.clienteId), findById(State.technicians, p.tecnicoId), p.observacoes) },
      isAllDay: true,
      start: { dateTime: p.dataAgendada + 'T00:00:00', timeZone: OUTLOOK_FUSO },
      end: { dateTime: addDaysIso(p.dataAgendadaFim || p.dataAgendada, 1) + 'T00:00:00', timeZone: OUTLOOK_FUSO },
      location: p.cidade ? { displayName: p.cidade } : undefined,
      showAs: p.confirmado ? 'busy' : 'tentative',
    });
  });
  return eventos;
}
async function sincronizarOutlook(){
  if(!OUTLOOK_CLIENT_ID){
    showAlert('A integração com o Outlook ainda não foi configurada: falta registrar o aplicativo no Azure e informar o "ID do aplicativo" no sistema.');
    return;
  }
  const eventos = coletarEventosOutlook();
  if(eventos.length === 0 && !(await confirmAction('Não há nada agendado na tela agora. Continuar mesmo assim vai esvaziar o calendário "' + OUTLOOK_NOME_CALENDARIO + '" no seu Outlook. Continuar?'))) return;
  if(!(await confirmAction('Enviar ' + eventos.length + ' item(ns) da agenda atual para o calendário "' + OUTLOOK_NOME_CALENDARIO + '" do seu Outlook? O conteúdo anterior desse calendário será substituído (não use-o para compromissos pessoais).'))) return;
  const btn = document.getElementById('btn-sync-outlook');
  const textoOriginal = btn ? btn.textContent : '';
  if(btn){ btn.disabled = true; btn.textContent = 'Sincronizando…'; }
  try{
    const token = await outlookObterToken();
    const lista = await graphFetch(token, '/me/calendars?$top=100&$select=id,name');
    let cal = (lista.value || []).find(c => c.name === OUTLOOK_NOME_CALENDARIO);
    if(!cal) cal = await graphFetch(token, '/me/calendars', { method: 'POST', body: JSON.stringify({ name: OUTLOOK_NOME_CALENDARIO }) });
    // Apaga o que já estava no calendário do Painel e recria tudo (evita duplicar e dispensa guardar mapeamentos).
    let proxima = '/me/calendars/' + cal.id + '/events?$top=100&$select=id';
    while(proxima){
      const pagina = await graphFetch(token, proxima);
      const ids = (pagina.value || []).map(e => e.id);
      if(ids.length) await graphBatch(token, ids.map(id => ({ method: 'DELETE', url: '/me/events/' + id })));
      proxima = pagina['@odata.nextLink'] || null;
    }
    await graphBatch(token, eventos.map(ev => ({
      method: 'POST', url: '/me/calendars/' + cal.id + '/events',
      headers: { 'Content-Type': 'application/json' }, body: ev,
    })));
    registrarLog('Sincronizou ' + eventos.length + ' item(ns) da agenda com o Outlook');
    showAlert('Pronto! ' + eventos.length + ' item(ns) enviados para o calendário "' + OUTLOOK_NOME_CALENDARIO + '" no seu Outlook.');
  }catch(e){
    showAlert('Não foi possível sincronizar com o Outlook. ' + (e && e.message ? e.message : ''));
  }finally{
    if(btn){ btn.disabled = false; btn.textContent = textoOriginal; }
  }
}
