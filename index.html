/* Lista unificada de "eventos" do calendário (atendimentos + chamados já
   agendados), cada um com data início/fim — usada para desenhar barras
   contínuas que atravessam vários dias, em vez de um chip repetido em
   cada dia do período. */
function getCalendarEventos(){
  const apptEvt = getVisibleAppointments().map(a => ({
    id: a.id, tipo: 'appt', data: a.data, dataFim: a.dataFim || a.data,
    cor: getTecnicoColor(a.tecnicoId), titulo: buildTitle(a),
    tecnico: (findById(State.technicians, a.tecnicoId) || {}).nome,
    statusDot: a.status === 'OK' ? 'ok' : 'nok',
    editable: canEditAppt(a), horaInicio: a.horaInicio, diaTodo: a.diaTodo,
  }));
  const pendEvt = getVisibleScheduledPendencias().map(p => {
    const st = getPendenciaStatus(p);
    return {
      id: p.id, tipo: 'pend', data: p.dataAgendada, dataFim: p.dataAgendadaFim || p.dataAgendada,
      cor: getTecnicoColor(p.tecnicoId), titulo: buildTituloPendencia(p),
      tecnico: (findById(State.technicians, p.tecnicoId) || {}).nome,
      statusDot: st.cls === 'nok' ? 'nok' : 'ok',
      editable: podeGerenciarPendencia(p),
    };
  });
  return [...apptEvt, ...pendEvt];
}

/* Distribui os eventos que tocam os dias de "diasIso" (uma semana, ou os
   dias visíveis da semana útil) em "raias" horizontais sem sobreposição —
   como o Google Calendar/Outlook fazem com eventos de vários dias. Eventos
   que não cabem em "maxLanes" raias entram na contagem de "+N mais" de
   cada dia que tocam. */
function layoutLanes(diasIso, eventos, maxLanes){
  const rowStart = diasIso[0], rowEnd = diasIso[diasIso.length - 1];
  const preparados = eventos
    .filter(e => e.data <= rowEnd && e.dataFim >= rowStart)
    .map(e => {
      let colStart = diasIso.indexOf(e.data);
      let colEnd = diasIso.indexOf(e.dataFim);
      const isRealStart = colStart !== -1;
      const isRealEnd = colEnd !== -1;
      if(colStart === -1) colStart = 0;
      if(colEnd === -1) colEnd = diasIso.length - 1;
      return { evt: e, colStart, colEnd, isRealStart, isRealEnd };
    })
    .sort((a, b) => a.colStart - b.colStart || (b.colEnd - b.colStart) - (a.colEnd - a.colStart));

  const lanesFim = [];
  const bars = [];
  const overflowPerDay = {};
  preparados.forEach(item => {
    let laneIdx = lanesFim.findIndex(fim => fim < item.colStart);
    if(laneIdx === -1){
      if(lanesFim.length < maxLanes){
        laneIdx = lanesFim.length;
        lanesFim.push(item.colEnd);
      } else {
        for(let c = item.colStart; c <= item.colEnd; c++){
          const iso = diasIso[c];
          overflowPerDay[iso] = (overflowPerDay[iso] || 0) + 1;
        }
        return;
      }
    } else {
      lanesFim[laneIdx] = item.colEnd;
    }
    bars.push({ ...item, lane: laneIdx });
  });
  return { bars, overflowPerDay };
}

/* Monta o HTML de uma barra de evento (atendimento ou chamado), já
   posicionada em absoluto dentro do grid do calendário. Alças de
   redimensionamento só aparecem nas pontas que correspondem ao início/fim
   real do evento (não a um corte visual no fim de uma linha/semana). */
function renderEventBarHtml(bar, opts){
  const e = bar.evt;
  const idAttr = e.tipo === 'appt' ? `data-appt-id="${e.id}"` : `data-pendencia-id="${e.id}"`;
  const corBg = e.cor === 'transparent' ? 'var(--gray)' : e.cor;
  const handles = e.editable ? (
    (bar.isRealStart ? `<span class="cal-evt-resize cal-evt-resize-l" data-resize="start" ${idAttr} title="Arraste para ajustar a data início"></span>` : '') +
    (bar.isRealEnd ? `<span class="cal-evt-resize cal-evt-resize-r" data-resize="end" ${idAttr} title="Arraste para ajustar a data fim"></span>` : '')
  ) : '';
  const roundCls = (bar.isRealStart ? ' rl' : '') + (bar.isRealEnd ? ' rr' : '');
  const horaTxt = (opts.detailed && e.tipo === 'appt') ? `<span class="mono" style="font-size:10px; opacity:0.85;">${e.diaTodo ? 'Dia todo' : e.horaInicio}</span> ` : '';
  const label = `${statusConfirmIcon(e.statusDot === 'ok')}${horaTxt}${escapeHtml(e.titulo)}`;
  const titleAttr = `${escapeHtml(e.titulo)}${e.tecnico ? ' · ' + escapeHtml(e.tecnico) : ''}${e.editable ? ' — arraste para reagendar, puxe as bordas para ajustar o período, botão direito ou duplo clique para editar' : ''}`;
  return `<div class="cal-evt-bar${roundCls}" ${idAttr} draggable="${e.editable}" style="left:${opts.leftPct}%; width:${opts.widthPct}%; top:${opts.topPx}px; height:${opts.barH}px; background:${corBg};" data-select-day="${diasRowIso(bar)}" title="${titleAttr}">${label}${handles}</div>`;
}
function diasRowIso(bar){ return bar.__isoStart || ''; }

/* ----- Visão de Mês ----- */
function renderCalMes(){
  const anchor = State.calAnchor;
  const year = anchor.getFullYear(), mo = anchor.getMonth();
  const firstOfMonth = new Date(year, mo, 1);
  const startOffset = firstOfMonth.getDay();
  const daysInMonth = new Date(year, mo+1, 0).getDate();
  const daysInPrevMonth = new Date(year, mo, 0).getDate();
  const totalCells = Math.ceil((startOffset + daysInMonth)/7)*7;

  const apptsByDate = buildApptsByDate();
  const pendByDate = buildPendByDate();
  const eventos = getCalendarEventos();

  const calz = State.calFontScale || 1.1;
  const cellH = 112 * calz;
  const dowH = 34;
  const barH = Math.max(12, Math.round(14 * calz));
  const laneStep = barH + 2;
  const daynumH = Math.round(10 + 15 * calz);
  const bottomReserve = Math.round(7 + 13 * calz);
  const maxLanes = Math.max(1, Math.floor((cellH - daynumH - bottomReserve) / laneStep));

  let cells = '';
  let barsHtml = '';
  const today = todayISO();
  const totalRows = totalCells / 7;
  for(let r = 0; r < totalRows; r++){
    const diasRow = [];
    for(let c = 0; c < 7; c++){
      const i = r*7 + c;
      let dayNum, cellDate, outside=false;
      if(i < startOffset){
        dayNum = daysInPrevMonth - startOffset + i + 1;
        cellDate = new Date(year, mo-1, dayNum);
        outside = true;
      } else if(i >= startOffset + daysInMonth){
        dayNum = i - startOffset - daysInMonth + 1;
        cellDate = new Date(year, mo+1, dayNum);
        outside = true;
      } else {
        dayNum = i - startOffset + 1;
        cellDate = new Date(year, mo, dayNum);
      }
      diasRow.push({ iso: isoDate(cellDate), dayNum, outside });
    }
    const diasIso = diasRow.map(d => d.iso);
    const { bars, overflowPerDay } = layoutLanes(diasIso, eventos, maxLanes);
    const laneAreaH = bars.length ? (Math.max(...bars.map(b=>b.lane)) + 1) * laneStep : 0;

    diasRow.forEach(d => {
      const isToday = d.iso === today && !d.outside;
      const extra = overflowPerDay[d.iso] || 0;
      const more = extra > 0
        ? `<div class="cal-evt-more" style="margin-top:${laneAreaH}px;">+${extra} mais</div>`
        : (laneAreaH ? `<div style="height:${laneAreaH}px;"></div>` : '');
      cells += `<div class="cal-cell cal-dropzone ${d.outside?'outside':''} ${isToday?'today':''}" data-day="${d.iso}">
        <div class="daynum">${d.dayNum}</div>
        ${more}
      </div>`;
    });

    bars.forEach(bar => {
      bar.__isoStart = diasIso[bar.colStart];
      const topPx = r*(cellH+1) + dowH + 1 + daynumH + bar.lane*laneStep;
      const leftPct = (bar.colStart/7)*100;
      const widthPct = ((bar.colEnd-bar.colStart+1)/7)*100;
      barsHtml += renderEventBarHtml(bar, { topPx, leftPct, widthPct, barH, detailed:false });
    });
  }

  const dowRow = DOW.map(d => `<div class="cal-dow">${d}</div>`).join('');
  const dayPanel = State.selectedDay ? renderDayPanel(State.selectedDay, apptsByDate, pendByDate) : '';

  return `
    <div class="cal-head">
      <div class="cal-nav">
        <button id="cal-prev">‹</button>
        <div class="month-label">${MONTHS[mo]} ${year}</div>
        <button id="cal-next">›</button>
      </div>
      <button class="btn secondary" id="cal-today">Hoje</button>
    </div>
    <div class="cal-grid">${dowRow}${cells}${barsHtml}</div>
    ${dayPanel}
  `;
}

/* ----- Visão de Semana / Semana útil ----- */
function renderCalSemana(util){
  const start = startOfWeek(State.calAnchor, util);
  const numDays = util ? 5 : 7;
  const days = [];
  for(let i=0;i<numDays;i++) days.push(new Date(start.getFullYear(), start.getMonth(), start.getDate()+i));
  const diasIso = days.map(d => isoDate(d));

  const apptsByDate = buildApptsByDate();
  const pendByDate = buildPendByDate();
  const eventos = getCalendarEventos();
  const today = todayISO();

  const calz = State.calFontScale || 1.1;
  const headH = 54;
  const bodyH = Math.round(260 * calz);
  const barH = Math.max(12, Math.round(14 * calz));
  const laneStep = barH + 2;
  const bottomReserve = Math.round(8 + 13 * calz);
  const maxLanes = Math.max(1, Math.floor((bodyH - bottomReserve) / laneStep));

  const { bars, overflowPerDay } = layoutLanes(diasIso, eventos, maxLanes);
  const laneAreaH = bars.length ? (Math.max(...bars.map(b=>b.lane)) + 1) * laneStep : 0;

  const cols = days.map((d, idx) => {
    const iso = diasIso[idx];
    const isToday = iso === today;
    const extra = overflowPerDay[iso] || 0;
    const ocupado = extra > 0 || bars.some(b => idx >= b.colStart && idx <= b.colEnd);
    const more = extra > 0 ? `<div class="cal-evt-more" style="margin-top:${laneAreaH + 6}px;">+${extra} mais</div>` : '';
    const vazio = !ocupado ? '<div class="cal-daycol-empty" style="margin-top:6px;">—</div>' : '';
    return `
      <div class="cal-daycol cal-dropzone ${isToday?'today':''}" data-day="${iso}">
        <div class="cal-daycol-head">
          <div class="cal-daycol-dow">${DOW[d.getDay()]}</div>
          <div class="cal-daycol-num">${d.getDate()}</div>
        </div>
        <div class="cal-daycol-body">${more}${vazio}</div>
      </div>
    `;
  }).join('');

  let barsHtml = '';
  bars.forEach(bar => {
    bar.__isoStart = diasIso[bar.colStart];
    const topPx = headH + bar.lane*laneStep + 6;
    const leftPct = (bar.colStart/numDays)*100;
    const widthPct = ((bar.colEnd-bar.colStart+1)/numDays)*100;
    barsHtml += renderEventBarHtml(bar, { topPx, leftPct, widthPct, barH, detailed:true });
  });

  const rangeLabel = fmtDate(diasIso[0]) + ' – ' + fmtDate(diasIso[diasIso.length-1]);
  const dayPanel = State.selectedDay ? renderDayPanel(State.selectedDay, apptsByDate, pendByDate) : '';

  return `
    <div class="cal-head">
      <div class="cal-nav">
        <button id="cal-prev">‹</button>
        <div class="month-label">${rangeLabel}</div>
        <button id="cal-next">›</button>
      </div>
      <button class="btn secondary" id="cal-today">Hoje</button>
    </div>
    <div class="cal-week-grid" style="grid-template-columns:repeat(${numDays}, 1fr);">${cols}${barsHtml}</div>
    ${dayPanel}
  `;
}

/* Inicia o arraste de uma borda (alça) de um atendimento OU chamado agendado
   no calendário, para estender/encurtar seu período. "lado" é 'start'
   (borda esquerda) ou 'end' (borda direita). A borda oposta fica fixa; se o
   mouse passar por cima dela, os papéis de início/fim se invertem
   automaticamente (como no Google Calendar/Outlook). "campoInicio"/
   "campoFim" são os nomes dos campos de data no objeto (obj), e
   "persistKey"/"construirTitulo" dizem como salvar e nomear a mudança —
   isso permite reaproveitar a mesma lógica tanto para agendamentos quanto
   para chamados/pendências já agendados. */
function iniciarResizeData(obj, lado, campoInicio, campoFim, persistKey, construirTitulo){
  const fixoIso = lado === 'start' ? (obj[campoFim] || obj[campoInicio]) : obj[campoInicio];
  let hoverIso = lado === 'start' ? obj[campoInicio] : (obj[campoFim] || obj[campoInicio]);

  function limparDestaque(){
    document.querySelectorAll('.cal-dropzone.resize-preview').forEach(el => el.classList.remove('resize-preview'));
  }
  function aplicarDestaque(iso){
    limparDestaque();
    const novoInicio = iso < fixoIso ? iso : fixoIso;
    const novoFim = iso < fixoIso ? fixoIso : iso;
    datesBetween(novoInicio, novoFim).forEach(d => {
      document.querySelectorAll('.cal-dropzone[data-day="'+d+'"]').forEach(el => el.classList.add('resize-preview'));
    });
  }
  function onMove(e){
    const alvo = document.elementFromPoint(e.clientX, e.clientY);
    const celula = alvo && alvo.closest('.cal-dropzone[data-day]');
    if(celula){
      hoverIso = celula.dataset.day;
      aplicarDestaque(hoverIso);
    }
  }
  function onUp(){
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    limparDestaque();
    const novoInicio = hoverIso < fixoIso ? hoverIso : fixoIso;
    const novoFim = hoverIso < fixoIso ? fixoIso : hoverIso;
    if(novoInicio === obj[campoInicio] && novoFim === (obj[campoFim] || obj[campoInicio])) return;
    obj[campoInicio] = novoInicio;
    obj[campoFim] = novoFim;
    // Mudou o período: a confirmação anterior não vale mais — volta para
    // "não confirmado" (NOK), igual a qualquer outra ação de agenda.
    if('status' in obj) obj.status = 'NOK'; else if('confirmado' in obj) obj.confirmado = false;
    persist(persistKey, 'Ajustou período (arrastar borda) de "' + construirTitulo(obj) + '" para ' + fmtDate(novoInicio) + ' – ' + fmtDate(novoFim));
    render();
  }
  aplicarDestaque(hoverIso);
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
}

        const duracaoDiasPend = p.dataAgendada ? (datesBetween(p.dataAgendada, p.dataAgendadaFim || p.dataAgendada).length - 1) : 0;
        const novaDataFimPend = addDaysIso(novaData, duracaoDiasPend);

        appt.status = 'NOK';

/* ============ Modal genérico ============ */
function openModal(html){
  document.getElementById('modal-root').innerHTML = `<div class="modal-backdrop" id="modal-backdrop"><div class="modal">${html}</div></div>`;
  document.getElementById('modal-backdrop').addEventListener('mousedown', e => {
    if(e.target.id === 'modal-backdrop') closeModal();
  });
  // Impede duplo cadastro: clique repetido em "Salvar" antes do primeiro terminar.
  // Roda na fase de captura, antes do handler específico de cada modal, e
  // desabilita o botão já no primeiro clique.
  document.getElementById('modal-backdrop').addEventListener('click', (e) => {
    const btn = e.target.closest('#modal-save');
    if(!btn) return;
    if(btn.disabled){
      e.stopImmediatePropagation();
      e.preventDefault();
      return;
    }
    btn.disabled = true;
    btn.style.opacity = '0.6';
    btn.style.cursor = 'not-allowed';
    // Rede de segurança: se o modal continuar aberto (ex.: falha de validação
    // que não fecha o modal), reabilita o botão depois de um tempo.
    setTimeout(() => {
      if(btn.isConnected){ btn.disabled = false; btn.style.opacity = ''; btn.style.cursor = ''; }
    }, 4000);
  }, true);
  const firstField = document.querySelector('#modal-backdrop input, #modal-backdrop select');
  if(firstField) firstField.focus();
}

/* Diálogos de confirmação/aviso próprios — o navegador dentro do artefato
   bloqueia confirm()/alert() nativos, então usamos o mesmo sistema de modal
   da aplicação para isso. */
function confirmAction(message, opts){
  opts = opts || {};
  return new Promise((resolve) => {
    openModal(`
      <div class="modal-head">
        <h3>${escapeHtml(opts.title || 'Confirmar ação')}</h3>
        <button class="modal-close" id="modal-close">✕</button>
      </div>
      <div class="modal-body">
        <div style="font-size:13.5px; color:var(--ink-soft); line-height:1.55;">${escapeHtml(message)}</div>
      </div>
      <div class="modal-foot">
        <button class="btn secondary" id="confirm-no">Cancelar</button>
        <button class="btn ${opts.danger === false ? '' : 'danger'}" id="confirm-yes">${escapeHtml(opts.confirmLabel || 'Confirmar')}</button>
      </div>
    `);
    const finish = (result) => { closeModal(); resolve(result); };
    document.getElementById('modal-close').addEventListener('click', () => finish(false));
    document.getElementById('confirm-no').addEventListener('click', () => finish(false));
    document.getElementById('confirm-yes').addEventListener('click', () => finish(true));
  });
}
function showAlert(message, title){
  openModal(`
    <div class="modal-head">
      <h3>${escapeHtml(title || 'Aviso')}</h3>
      <button class="modal-close" id="modal-close">✕</button>
    </div>
    <div class="modal-body">
      <div style="font-size:13.5px; color:var(--ink-soft); line-height:1.55;">${escapeHtml(message)}</div>
    </div>
    <div class="modal-foot">
      <button class="btn" id="alert-ok">OK</button>
    </div>
  `);
  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('alert-ok').addEventListener('click', closeModal);
}

/* Menu de contexto (botão direito) — genérico, para qualquer lista de opções. */
let ctxCloseHandler = null;
function closeContextMenu(){
  const existing = document.getElementById('context-menu');
  if(existing) existing.remove();
  if(ctxCloseHandler){
    document.removeEventListener('click', ctxCloseHandler, true);
    document.removeEventListener('contextmenu', ctxCloseHandler, true);
    ctxCloseHandler = null;
  }
}
function showContextMenu(x, y, items){
  closeContextMenu();
  const menu = document.createElement('div');
  menu.className = 'context-menu';
  menu.id = 'context-menu';
  menu.style.left = x + 'px';
  menu.style.top = y + 'px';
  menu.innerHTML = items.map((it, i) => `<button type="button" class="context-menu-item" data-ctx-idx="${i}">${escapeHtml(it.label)}</button>`).join('');
  document.body.appendChild(menu);
  // mantém dentro da tela se abrir perto da borda direita/inferior
  const rect = menu.getBoundingClientRect();
  if(rect.right > window.innerWidth) menu.style.left = Math.max(4, window.innerWidth - rect.width - 8) + 'px';
  if(rect.bottom > window.innerHeight) menu.style.top = Math.max(4, window.innerHeight - rect.height - 8) + 'px';
  menu.querySelectorAll('[data-ctx-idx]').forEach(btn => btn.addEventListener('click', (e) => {
    e.stopPropagation();
    const idx = +btn.dataset.ctxIdx;
    closeContextMenu();
    items[idx].action();
  }));
  ctxCloseHandler = (e) => {
    if(menu.contains(e.target)) return; // clique/botão-direito dentro do próprio menu não fecha
    closeContextMenu();
  };
  // fase de captura: fecha um menu antigo ANTES do handler do novo alvo criar outro,
  // evitando que o menu recém-aberto seja apagado no mesmo clique que o abriu
  setTimeout(() => {
    document.addEventListener('click', ctxCloseHandler, true);
    document.addEventListener('contextmenu', ctxCloseHandler, true);
  }, 0);
}

/* Autocomplete (combobox) de clientes do modal de contrato, filtrável por
   nome, fantasia, CNPJ ou cidade. Ao contrário de um <select> comum, o
   dropdown fecha ao selecionar/confirmar e o texto digitado é substituído
   pelo nome do cliente escolhido — dando feedback claro de que a seleção
   funcionou — e aceita navegação por teclado (setas/Enter/Esc). */
function clienteLabelContrato(c){
  return `${c.nome}${c.cnpj ? ' — ' + c.cnpj : ''}${c.cidade ? ' (' + c.cidade + ')' : ''}`;
}
function filtrarClientesContrato(filtro){
  const termo = (filtro||'').toLowerCase().trim();
  if(!termo) return State.clients;
  return State.clients.filter(c =>
    (c.nome||'').toLowerCase().includes(termo) ||
    (c.nomeFantasia||'').toLowerCase().includes(termo) ||
    (c.cnpj||'').toLowerCase().includes(termo) ||
    (c.cidade||'').toLowerCase().includes(termo)
  );
}
function renderClienteDropdownItens(lista, activeIdx){
  if(State.clients.length === 0) return '<div class="autocomplete-empty">Nenhum cliente cadastrado — use "+ Novo" para cadastrar.</div>';
  if(lista.length === 0) return '<div class="autocomplete-empty">Nenhum cliente encontrado para esta busca.</div>';
  return lista.map((c, i) => `<div class="autocomplete-item${i===activeIdx?' active':''}" data-idx="${i}" data-id="${c.id}">${escapeHtml(clienteLabelContrato(c))}</div>`).join('');
}
/* Liga um campo de busca de cliente (input de texto) a um dropdown
   customizado, com suporte a mouse e teclado. onSelect(cliente) é chamado
   quando uma seleção é confirmada (clique, Enter ou Tab sobre um item). */
function ligarAutocompleteCliente({ inputId, dropdownId, clienteInicialId, onSelect }){
  const input = document.getElementById(inputId);
  const dropdown = document.getElementById(dropdownId);
  let lista = filtrarClientesContrato('');
  let activeIdx = -1;
  let selecionado = clienteInicialId ? findById(State.clients, clienteInicialId) : null;

  function labelAtual(){ return selecionado ? clienteLabelContrato(selecionado) : ''; }
  input.value = labelAtual();

  function abrir(){
    dropdown.innerHTML = renderClienteDropdownItens(lista, activeIdx);
    dropdown.style.display = 'block';
  }
  function fechar(){ dropdown.style.display = 'none'; activeIdx = -1; }
  function atualizarLista(filtro){
    lista = filtrarClientesContrato(filtro);
    activeIdx = lista.length ? 0 : -1;
    abrir();
  }
  function destacar(idx){
    activeIdx = idx;
    dropdown.innerHTML = renderClienteDropdownItens(lista, activeIdx);
    const ativo = dropdown.querySelector('.autocomplete-item.active');
    if(ativo) ativo.scrollIntoView({ block: 'nearest' });
  }
  function confirmarSelecao(cliente){
    selecionado = cliente;
    input.value = labelAtual();
    fechar();
    onSelect(cliente);
  }

  input.addEventListener('focus', () => atualizarLista(''));
  input.addEventListener('input', () => atualizarLista(input.value));
  input.addEventListener('keydown', (e) => {
    if(dropdown.style.display !== 'block' && (e.key === 'ArrowDown' || e.key === 'ArrowUp')){
      atualizarLista(input.value);
      return;
    }
    if(e.key === 'ArrowDown'){ e.preventDefault(); e.stopPropagation(); if(lista.length) destacar((activeIdx + 1) % lista.length); }
    else if(e.key === 'ArrowUp'){ e.preventDefault(); e.stopPropagation(); if(lista.length) destacar((activeIdx - 1 + lista.length) % lista.length); }
    else if(e.key === 'Enter'){
      // Enter aqui serve para confirmar a seleção do cliente, não para salvar
      // o formulário inteiro — por isso interrompe a propagação para o atalho
      // global de "Enter confirma" sempre que o dropdown estiver aberto.
      if(dropdown.style.display === 'block'){
        e.preventDefault();
        e.stopPropagation();
        if(activeIdx >= 0 && lista[activeIdx]) confirmarSelecao(lista[activeIdx]);
      }
    } else if(e.key === 'Escape'){
      e.stopPropagation();
      fechar();
      input.value = labelAtual();
    }
  });
  // mousedown (não click) para registrar a seleção antes do blur do input esconder o dropdown
  dropdown.addEventListener('mousedown', (e) => {
    const item = e.target.closest('.autocomplete-item[data-id]');
    if(!item) return;
    e.preventDefault();
    const cliente = findById(State.clients, item.dataset.id);
    if(cliente) confirmarSelecao(cliente);
  });
  input.addEventListener('blur', () => {
    // pequeno atraso para o mousedown do item processar antes de fechar/reverter
    setTimeout(() => {
      input.value = labelAtual();
      fechar();
    }, 120);
  });

  return {
    getSelecionado: () => selecionado,
    setSelecionado: (cliente) => { selecionado = cliente; input.value = labelAtual(); },
  };
}

    const tecnicoPrincipalAntes = editing ? (contratoTecnicoIds(editing)[0] || '') : '';
    const data = {contratoId, taVigente, clienteId, cidade, vencimento, valor, tecnicoIds, tecnicoId: tecnicoIds[0] || '', art, status, vencimentoArt, statusArt, indexador, observacao};
    let contract;

      Object.assign(editing, data);
      contract = editing;
    } else {
      contract = { id: uid('ctr'), frequencia: '', planos: [], ...data };
      State.contracts.push(contract);
    }
    persist('contracts', (isNew ? 'Cadastrou ' : 'Editou ') + 'contrato' + (taVigente ? ' (' + taVigente + ')' : '') + (isNew ? ' — status ' + status : ''));

    // Se o técnico responsável do contrato mudou, acompanha a troca nos
    // chamados/pendências já gerados por ele (Lista de Pendências e
    // calendário), que antes ficavam com o técnico antigo "congelado" —
    // só nos que ainda não foram atendidos e que não tiveram o técnico
    // trocado manualmente num chamado específico (esses são respeitados).
    const tecnicoPrincipalDepois = tecnicoIds[0] || '';
    if(!isNew && tecnicoPrincipalDepois !== tecnicoPrincipalAntes){
      let atualizados = 0;
      State.pendencias.forEach(p => {
        if(p.contractId !== contract.id || p.tecnicoId !== tecnicoPrincipalAntes) return;
        const fim = p.dataAgendadaFim || p.dataAgendada;
        if(fim && fim < todayISO()) return; // não reescreve o histórico de atendimentos já concluídos
        p.tecnicoId = tecnicoPrincipalDepois;
        atualizados++;
      });
      if(atualizados > 0){
        persist('pendencias', 'Atualizou o técnico responsável em ' + atualizados + ' chamado(s) do contrato ' + (taVigente || contract.id) + ' (acompanhando a troca no cadastro do contrato)');
      }
    }

    if((status === 'Suspenso' || status === 'Cancelado')){
      const antes = State.pendencias.length;
      State.pendencias = State.pendencias.filter(p => !(p.contractId === contract.id && !p.dataAgendada));
      if(State.pendencias.length !== antes) persist('pendencias', 'Removeu pendências não agendadas do contrato ' + (taVigente || contract.id) + ' (' + status + ')');
    }

    closeModal();
    render();
    if(isNew){
      showAlert('Contrato cadastrado. Uma pendência de cadastro técnico foi aberta — complete Frequência e Plano de manutenção em Contratos > Gerenciamento Técnico.');
    }
  });
}
async function deleteContract(id){
  if(!(await confirmAction('Remover este contrato? Isso também remove o vínculo com o Gerenciamento Técnico.'))) return;
  const c = findById(State.contracts, id);
  State.contracts = State.contracts.filter(c => c.id !== id);
  persist('contracts', 'Removeu contrato' + (c && c.taVigente ? ' (' + c.taVigente + ')' : ''));
  render();
}

/* ---------- Modal: Plano de manutenção (Gerenciamento Técnico) ---------- */
const MONTH_ABBR = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const PLANO_TIPOS = { MP: 'MP — Manutenção Preventiva', C: 'C — Calibração', TSE: 'TSE — Teste de Segurança Elétrica' };
/* Resumo do(s) plano(s) de manutenção de um contrato para a coluna da
   listagem: inicial do serviço (C/MP/TSE) + os meses marcados, por
   extenso (abreviados), em vez de só a quantidade de meses. */
function planosResumoTexto(planos){
  if(!planos || planos.length === 0) return '';
  return planos.map(p => {
    const meses = [...(p.meses || [])].sort((a,b) => a-b).map(m => MONTH_ABBR[m-1]).join(', ');
    const tipos = (p.tipos && p.tipos.length) ? p.tipos.join('/') : (p.tipo || '');
    return tipos + (meses ? ': ' + meses : '');
  }).join(' · ');
}

/* Gera pendências a partir do plano de manutenção do contrato: UM chamado
   por mês (não por serviço), com data limite no dia 28 daquele mês, que
   reúne todos os tipos de serviço marcados para aquele mês (ex.:
   Calibração + MP juntos num chamado só) — assim o técnico/admin tem só
   um registro pra agendar e gerenciar por mês/contrato, mesmo quando há
   mais de um serviço previsto. Não recria o chamado se já existir um para
   o mesmo contrato+mês (evita duplicar a cada vez que o plano é salvo); se
   o plano ganhar um serviço novo para um mês que já tinha chamado gerado,
   o serviço é simplesmente somado ao chamado existente. Não gera para
   meses já passados no ano corrente. */
async function gerarPendenciasDoContrato(c){
  const year = new Date().getFullYear();
  const monthNow = new Date().getMonth() + 1;

  // Primeiro reúne, por mês, todos os tipos marcados em qualquer bloco do
  // plano (um contrato pode ter mais de um bloco de plano).
  const tiposPorMes = new Map();
  (c.planos || []).forEach(plano => {
    const tipos = (plano.tipos && plano.tipos.length) ? plano.tipos : (plano.tipo ? [plano.tipo] : []);
    (plano.meses || []).forEach(mes => {
      if(mes < monthNow) return;
      if(!tiposPorMes.has(mes)) tiposPorMes.set(mes, new Set());
      tipos.forEach(t => tiposPorMes.get(mes).add(t));
    });
  });

  const existentesPorChave = new Map(
    State.pendencias.filter(p => p.contractId === c.id).map(p => [p.chaveOrigem, p])
  );
  let created = 0, atualizados = 0;
  tiposPorMes.forEach((tiposSet, mes) => {
    const chave = year + '-' + String(mes).padStart(2,'0');
    const tipos = [...tiposSet];
    const existente = existentesPorChave.get(chave);
    if(existente){
      const novos = tipos.filter(t => !pendenciaServicosArray(existente).includes(t));
      if(novos.length){
        existente.servicos = [...pendenciaServicosArray(existente), ...novos];
        atualizados++;
      }
      return;
    }
    const dataLimite = year + '-' + String(mes).padStart(2,'0') + '-28';
    State.pendencias.push({
      id: uid('pnd'),
      contractId: c.id,
      chaveOrigem: chave,
      origem: 'contrato',
      dataLimite,
      dataAgendada: '',
      confirmado: false,
      clienteId: c.clienteId,
      cidade: c.cidade,
      tecnicoId: contratoTecnicoIds(c)[0] || '',
      servicos: tipos,
      padraoIds: [],
      observacoes: '',
    });
    created++;
  });
  if(created > 0 || atualizados > 0) persist('pendencias');
  return created;
}

function openPlanoModal(id){

  const tecnicosNomes = contratoTecnicosNomes(c);
  let planosDraft = (c.planos || []).map(p => ({ tipos: (p.tipos && p.tipos.length) ? [...p.tipos] : (p.tipo ? [p.tipo] : []), meses: [...(p.meses || [])] }));

        <div class="hint" style="margin-top:8px;">Marque mais de um serviço no mesmo bloco para gerar uma pendência de cada no(s) mesmo(s) mês(es). Cada mês marcado gera, no futuro (Fase 4), uma pendência com prazo até o dia 28 daquele mês.</div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn secondary" id="modal-cancel">Cancelar</button>
      <button class="btn" id="modal-save">Salvar</button>
    </div>
  `);

  function renderPlanosList(){
    const wrap = document.getElementById('pl-lista');
    if(planosDraft.length === 0){
      wrap.innerHTML = '<div class="hint">Nenhum plano adicionado ainda.</div>';
      return;
    }
    wrap.innerHTML = planosDraft.map((p, idx) => `
      <div style="border:1px solid var(--line); border-radius:var(--radius-s); padding:10px; margin-top:8px;">
        <div style="display:flex; gap:8px; align-items:flex-start; margin-bottom:8px;">
          <div style="flex:1; display:flex; flex-wrap:wrap; gap:3px 12px;">
            ${Object.keys(PLANO_TIPOS).map(t => `<label style="display:flex; align-items:center; gap:5px; font-size:13px; cursor:pointer; padding:4px 0;">
              <input type="checkbox" class="pl-tipo-chk" data-plano-tipo="${idx}" value="${t}" ${p.tipos.includes(t)?'checked':''} style="width:15px; height:15px;">
              ${PLANO_TIPOS[t]}
            </label>`).join('')}
          </div>
          <button type="button" class="icon-btn danger" data-plano-remove="${idx}">Remover</button>
        </div>
        <div style="display:flex; flex-wrap:wrap; gap:5px;">
          ${MONTH_ABBR.map((m, mi) => `<button type="button" class="month-chip ${p.meses.includes(mi+1)?'active':''}" data-plano-mes="${idx}:${mi+1}">${m}</button>`).join('')}
        </div>
      </div>
    `).join('');

    wrap.querySelectorAll('.pl-tipo-chk').forEach(chk => chk.addEventListener('change', (e) => {
      const idx = +e.target.dataset.planoTipo;
      const tipos = planosDraft[idx].tipos;
      const pos = tipos.indexOf(e.target.value);
      if(e.target.checked){ if(pos === -1) tipos.push(e.target.value); }
      else if(pos !== -1) tipos.splice(pos, 1);
    }));
    wrap.querySelectorAll('[data-plano-remove]').forEach(btn => btn.addEventListener('click', () => {
      planosDraft.splice(+btn.dataset.planoRemove, 1);
      renderPlanosList();
    }));
    wrap.querySelectorAll('[data-plano-mes]').forEach(btn => btn.addEventListener('click', () => {
      const [idx, mes] = btn.dataset.planoMes.split(':').map(Number);
      const meses = planosDraft[idx].meses;
      const pos = meses.indexOf(mes);
      if(pos === -1) meses.push(mes); else meses.splice(pos, 1);
      renderPlanosList();
    }));
  }
  renderPlanosList();

  document.getElementById('pl-add').addEventListener('click', () => {
    planosDraft.push({ tipos: ['MP'], meses: [] });
    renderPlanosList();
  });

  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('modal-cancel').addEventListener('click', closeModal);
  document.getElementById('modal-save').addEventListener('click', async () => {
    c.frequencia = document.getElementById('pl-freq').value;

    if(criadas > 0){
      showAlert(criadas + ' pendência(s) gerada(s) na lista de Pendências/Chamados, a partir dos meses marcados.');
    }
  });
}

/* ---------- Importação de planilha de contratos ---------- */
/* Remove tudo que não for dígito do CNPJ, para comparar "00.000.000/0000-00"
   com "00000000000000" como o mesmo registro na hora de localizar o cliente. */
function normalizeCnpj(s){ return (s||'').replace(/\D/g, ''); }

function openImportContractsModal(){
  openModal(`
    <div class="modal-head">
      <h3>Importar planilha de contratos</h3>
      <button class="modal-close" id="modal-close">✕</button>
    </div>
    <div class="modal-body">
      <div class="hint">
        A planilha deve ter uma linha de cabeçalho e as colunas nesta ordem:<br>
        <strong>1. ID</strong> · <strong>2. TA Vigente</strong> · <strong>3. CNPJ</strong> · <strong>4. Vencimento (DD/MM/AAAA)</strong> · <strong>5. Valor</strong> · <strong>6. Técnico</strong> · <strong>7. ART</strong> · <strong>8. Vencimento ART (DD/MM/AAAA)</strong> · <strong>9. Status ART (Válida/Inválida)</strong> · <strong>10. Indexador</strong> · <strong>11. Observação</strong>
      </div>
      <div class="hint" style="margin-top:6px;">O CNPJ é a chave de busca no cadastro de clientes: se já existir um cliente com esse CNPJ, o contrato é vinculado a ele (cidade herdada do cadastro); se não existir, um cliente novo é criado só com o CNPJ — complete o nome depois em "Clientes". Na coluna Técnico, separe mais de um nome por vírgula ou ponto e vírgula; nomes não encontrados no cadastro são ignorados.</div>
      <div class="field" style="margin-top:14px;">
        <label for="impc-file">Arquivo (.xlsx ou .csv)</label>
        <input type="file" id="impc-file" accept=".xlsx,.xls,.csv">
      </div>
      <div id="impc-preview" class="hint" style="margin-top:10px;"></div>
    </div>
    <div class="modal-foot">
      <button class="btn secondary" id="modal-cancel">Cancelar</button>
      <button class="btn" id="modal-save" disabled>Importar</button>
    </div>
  `);
  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('modal-cancel').addEventListener('click', closeModal);

  let parsedRows = [];

  document.getElementById('impc-file').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    const preview = document.getElementById('impc-preview');
    const saveBtn = document.getElementById('modal-save');
    parsedRows = [];
    saveBtn.disabled = true;
    if(!file) return;
    if(typeof XLSX === 'undefined'){
      preview.textContent = 'Não foi possível carregar o leitor de planilhas. Verifique sua conexão e tente novamente.';
      return;
    }
    try{
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, {type:'array', cellDates:true});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, {header:1, raw:false, defval:''});
      const rowsRaw = XLSX.utils.sheet_to_json(sheet, {header:1, raw:true, defval:''});
      const dataRows = rows.slice(1).filter(r => r.some(c => String(c).trim() !== ''));
      const dataRowsRaw = rowsRaw.slice(1);
      parsedRows = dataRows.map((r, i) => ({
        contratoId: String(r[0]||'').trim(),
        taVigente: String(r[1]||'').trim(),
        cnpj: String(r[2]||'').trim(),
        vencimento: extractCellDate((dataRowsRaw[i]||[])[3], r[3]),
        valor: formatBRL(r[4]),
        tecnicoNomes: String(r[5]||'').trim(),
        art: String(r[6]||'').trim(),
        vencimentoArt: extractCellDate((dataRowsRaw[i]||[])[7], r[7]),
        statusArt: String(r[8]||'').trim().toLowerCase().startsWith('inv') ? 'Inválida' : 'Válida',
        indexador: String(r[9]||'').trim(),
        observacao: String(r[10]||'').trim(),
      })).filter(r => r.contratoId && r.cnpj);
      if(parsedRows.length === 0){
        preview.textContent = 'Nenhum registro válido encontrado (confira se a coluna 1 = ID e a coluna 3 = CNPJ estão preenchidas).';
      } else {
        preview.textContent = parsedRows.length + ' registro(s) encontrados e prontos para importar.';
        saveBtn.disabled = false;
      }
    }catch(err){
      preview.textContent = 'Não foi possível ler esse arquivo. Confira o formato e tente novamente.';
    }
  });

  document.getElementById('modal-save').addEventListener('click', async () => {
    let criadosSemNome = 0;
    const findOrCreateClientByCnpj = (cnpj) => {
      const norm = normalizeCnpj(cnpj);
      if(!norm) return null;
      let cl = State.clients.find(c => normalizeCnpj(c.cnpj) === norm);
      if(!cl){
        cl = { id: uid('cli'), clienteId: '', nome: '', nomeFantasia: '', cidade: '', cnpj: cnpj.trim() };
        State.clients.push(cl);
        criadosSemNome++;
      }
      return cl;
    };
    const findTechnicianIds = (nomes) => {
      if(!nomes) return [];
      return nomes.split(/[,;]/).map(n => n.trim()).filter(Boolean).map(n => {
        const t = State.technicians.find(tec => tec.nome.trim().toLowerCase() === n.toLowerCase());
        return t ? t.id : null;
      }).filter(Boolean);
    };
    parsedRows.forEach(r => {
      const cliente = findOrCreateClientByCnpj(r.cnpj);
      const tecnicoIds = findTechnicianIds(r.tecnicoNomes);
      State.contracts.push({
        id: uid('ctr'),
        contratoId: r.contratoId,
        taVigente: r.taVigente,
        clienteId: cliente ? cliente.id : '',
        cidade: cliente ? (cliente.cidade || '') : '',
        vencimento: r.vencimento,
        valor: r.valor,
        tecnicoIds,
        tecnicoId: tecnicoIds[0] || '',
        art: r.art,
        status: 'Ativo',
        vencimentoArt: r.vencimentoArt,
        statusArt: r.statusArt,
        indexador: r.indexador,
        observacao: r.observacao,
        frequencia: '',
        planos: [],
      });
    });
    await persist('contracts', 'Importou contratos via planilha');
    await persist('clients');
    closeModal();
    render();
    if(criadosSemNome > 0){
      showAlert('Importação concluída. ' + criadosSemNome + ' cliente(s) foram criados automaticamente a partir do CNPJ sem nome preenchido — complete o cadastro em "Clientes".');
    }
  });
}

/* ---------- Modal: Pendência/Chamado ---------- */
/* Monta a lista de checkboxes de padrões disponíveis para um chamado,
   restrita aos padrões cadastrados com o técnico selecionado ou cuja
   oficina atual seja a oficina desse técnico. Padrões já marcados
   continuam aparecendo mesmo que não se encaixem mais no filtro (ex.:
   técnico trocado depois de já ter marcado algo), para não sumir
   silenciosamente uma seleção feita pelo usuário. */
function renderPadraoChecklist(tecnicoIdFiltro, checkedIds){
  const tecnicoOficinaId = tecnicoIdFiltro ? (findById(State.technicians, tecnicoIdFiltro) || {}).oficinaId : null;
  const items = State.tools
    .filter(t => !tecnicoIdFiltro || t.tecnicoId === tecnicoIdFiltro || (tecnicoOficinaId && (t.oficinaAtualId || t.localUsoId) === tecnicoOficinaId) || checkedIds.includes(t.id))
    .filter(t => getPadraoStatus(t).label !== 'Vencida' || checkedIds.includes(t.id));
  if(items.length === 0){
    return `<div class="hint" style="padding:6px 0;">${tecnicoIdFiltro ? 'Nenhum padrão cadastrado com este técnico ou com a oficina dele como local de uso.' : 'Selecione um técnico para ver os padrões disponíveis.'}</div>`;
  }
  return items.map(t => {
    const checked = checkedIds.includes(t.id);
    const busca = (t.ferramentaId + ' ' + t.tipo).toLowerCase();
    return `<label data-busca="${escapeHtml(busca)}" style="display:flex; align-items:center; gap:8px; padding:5px 2px; font-size:13px; cursor:pointer;">
      <input type="checkbox" class="pd-padrao-chk" value="${t.id}" ${checked?'checked':''} style="width:15px; height:15px; flex-shrink:0;">
      ${escapeHtml(t.ferramentaId)} — ${escapeHtml(t.tipo)}
    </label>`;
  }).join('');
}

    if(di && (!df || df < di)) dfField.value = toBRInputValue(di);
  });

  let pdConfirmado = confirmadoAtual;
  const pdStatusBtns = document.querySelectorAll('#pd-status button');
  pdStatusBtns.forEach(b => b.addEventListener('click', () => {
    pdConfirmado = b.dataset.val === 'OK';
    pdStatusBtns.forEach(x => x.classList.remove('active'));
    b.classList.add('active');
  }));

  const clienteSel = document.getElementById('pd-cliente');
  if(clienteSel) clienteSel.addEventListener('change', (e) => {
    const cidadeField = document.getElementById('pd-cidade');
    const cliente = findById(State.clients, e.target.value);
    if(cliente && cliente.cidade && !cidadeField.value) cidadeField.value = cliente.cidade;
  });

  function aplicarBuscaPadrao(){
    const buscaEl = document.getElementById('pd-padrao-busca');
    const termo = buscaEl ? buscaEl.value.trim().toLowerCase() : '';
    document.querySelectorAll('#pd-padrao-lista label').forEach(lbl => {
      lbl.style.display = (!termo || (lbl.dataset.busca || '').includes(termo)) ? 'flex' : 'none';
    });
  }
  const pdPadraoBusca = document.getElementById('pd-padrao-busca');
  if(pdPadraoBusca) pdPadraoBusca.addEventListener('input', aplicarBuscaPadrao);

  const pdTecnicoEl = document.getElementById('pd-tecnico');
  if(pdTecnicoEl && pdTecnicoEl.tagName === 'SELECT'){
    pdTecnicoEl.addEventListener('change', () => {
      const checkedNow = Array.from(document.querySelectorAll('.pd-padrao-chk:checked')).map(el => el.value);
      document.getElementById('pd-padrao-lista').innerHTML = renderPadraoChecklist(pdTecnicoEl.value, checkedNow);
      aplicarBuscaPadrao();
    });
  }

  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('modal-cancel').addEventListener('click', closeModal);
  if(editing) document.getElementById('modal-delete').addEventListener('click', () => { deletePendencia(editing.id); });

  document.getElementById('modal-save').addEventListener('click', async () => {
    const dataLimite = parseBRDate(document.getElementById('pd-limite').value);
    const dataAgendada = parseBRDate(document.getElementById('pd-agendada').value);
    let dataAgendadaFim = parseBRDate(document.getElementById('pd-agendada-fim').value);
    const tecnicoId = document.getElementById('pd-tecnico').value;
    const padraoIds = Array.from(document.querySelectorAll('.pd-padrao-chk:checked')).map(el => el.value);
    const confirmado = pdConfirmado;
    const observacoes = document.getElementById('pd-obs').value.trim();
    if(!dataLimite){ showAlert('Informe a data limite.'); return; }
    if(dataAgendada && !dataAgendadaFim) dataAgendadaFim = dataAgendada;
    if(dataAgendada && dataAgendadaFim < dataAgendada){ showAlert('A data fim não pode ser anterior à data início.'); return; }
    if(!dataAgendada) dataAgendadaFim = '';

    if(origemContrato){
      const servicos = Array.from(document.querySelectorAll('.pd-servico-contrato-chk:checked')).map(el => el.value);
      if(servicos.length === 0){ showAlert('Marque ao menos um serviço para este chamado.'); return; }
      Object.assign(editing, { dataLimite, dataAgendada, dataAgendadaFim, tecnicoId, padraoIds, confirmado, observacoes, servicos });
      delete editing.servico;
      delete editing.planoManutencao;
    } else {
      const clienteId = document.getElementById('pd-cliente').value;
      const cidade = document.getElementById('pd-cidade').value.trim();
      const servico = document.getElementById('pd-servico').value.trim();
      if(!clienteId){ showAlert('Selecione o cliente.'); return; }
      if(!tecnicoId){ showAlert('Selecione o técnico.'); return; }
      const data = { dataLimite, dataAgendada, dataAgendadaFim, clienteId, cidade, tecnicoId, servico, padraoIds, confirmado, observacoes };
      if(editing){
        Object.assign(editing, data);
      } else {
        State.pendencias.push({ id: uid('pnd'), origem: 'manual', contractId: '', chaveOrigem: '', ...data });
      }
    }
    persist('pendencias', (editing ? 'Editou ' : 'Cadastrou ') + 'chamado/pendência' + (dataAgendada ? ' — agendado para ' + fmtDate(dataAgendada) : ''));
    closeModal();
    render();
  });
}

  if(!(await confirmAction('Remover este chamado/pendência?'))) return;
  State.pendencias = State.pendencias.filter(p => p.id !== id);

/* ---------- Agenda de uso de um padrão (botão direito) ---------- */
function openPadraoAgendaModal(toolId){
  const t = findById(State.tools, toolId);
  if(!t) return;
  let anchor = new Date();

  openModal(`
    <div class="modal-head">
      <h3>Agenda de uso — ${escapeHtml(t.ferramentaId)}</h3>
      <button class="modal-close" id="modal-close">✕</button>
    </div>
    <div class="modal-body">
      <div class="cal-head" style="margin-bottom:10px;">
        <div class="cal-nav">
          <button id="pcal-prev">‹</button>
          <div class="month-label" id="pcal-label"></div>
          <button id="pcal-next">›</button>
        </div>
      </div>
      <div id="pcal-grid"></div>
      <div style="display:flex; gap:14px; margin-top:12px; font-size:12px; color:var(--ink-soft); flex-wrap:wrap;">
        <span><span class="badge nok" style="padding:2px 6px;">${statusConfirmIcon(false)}</span> Agendado NOK</span>
        <span><span class="badge ok" style="padding:2px 6px;">${statusConfirmIcon(true)}</span> Agendado OK</span>
        <span><span class="badge azul" style="padding:2px 6px;"><span class="dot"></span></span> Atendido</span>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn secondary" id="modal-cancel">Fechar</button>
    </div>
  `);
  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('modal-cancel').addEventListener('click', closeModal);

  function renderGrid(){
    const year = anchor.getFullYear(), mo = anchor.getMonth();
    document.getElementById('pcal-label').textContent = MONTHS[mo] + ' ' + year;
    const firstOfMonth = new Date(year, mo, 1);
    const startOffset = firstOfMonth.getDay();
    const daysInMonth = new Date(year, mo+1, 0).getDate();
    const totalCells = Math.ceil((startOffset + daysInMonth) / 7) * 7;
    const today = todayISO();

    const usos = {};
    State.pendencias.filter(p => (p.padraoIds || []).includes(toolId) && p.dataAgendada).forEach(p => {
      const st = getPendenciaStatus(p);
      datesBetween(p.dataAgendada, p.dataAgendadaFim || p.dataAgendada).forEach(iso => { usos[iso] = st; });
    });
    State.appointments.filter(a => (a.ferramentaIds || []).includes(toolId)).forEach(a => {
      datesBetween(a.data, a.dataFim || a.data).forEach(iso => {
        if(iso < today) usos[iso] = { label: 'Atendido' };
        else usos[iso] = { label: a.status === 'OK' ? 'Agendado OK' : 'Agendado NOK' };
      });
    });

    let cells = DOW.map(d => `<div class="cal-dow">${d}</div>`).join('');
    for(let i=0;i<totalCells;i++){
      let dayNum, cellDate, outside = false;
      if(i < startOffset){
        dayNum = new Date(year, mo, 0).getDate() - startOffset + i + 1;
        cellDate = new Date(year, mo-1, dayNum);
        outside = true;
      } else if(i >= startOffset + daysInMonth){
        dayNum = i - startOffset - daysInMonth + 1;
        cellDate = new Date(year, mo+1, dayNum);
        outside = true;
      } else {
        dayNum = i - startOffset + 1;
        cellDate = new Date(year, mo, dayNum);
      }
      const iso = isoDate(cellDate);
      const isToday = iso === today && !outside;
      const uso = usos[iso];
      let dotHtml = '';
      if(uso){
        const cls = uso.label === 'Agendado OK' ? 'ok' : uso.label === 'Atendido' ? 'azul' : 'nok';
        dotHtml = `<span class="badge ${cls}" style="display:block; margin-top:3px; font-size:9px; padding:1px 4px;">${uso.label}</span>`;
      }
      cells += `<div class="cal-cell ${outside?'outside':''} ${isToday?'today':''}" style="min-height:56px; cursor:default;">
        <div class="daynum">${dayNum}</div>
        ${dotHtml}
      </div>`;
    }
    document.getElementById('pcal-grid').innerHTML = `<div class="cal-grid">${cells}</div>`;
  }
  renderGrid();

  document.getElementById('pcal-prev').addEventListener('click', () => { anchor = new Date(anchor.getFullYear(), anchor.getMonth()-1, 1); renderGrid(); });
  document.getElementById('pcal-next').addEventListener('click', () => { anchor = new Date(anchor.getFullYear(), anchor.getMonth()+1, 1); renderGrid(); });
}

/* ---------- Importação de planilha de padrões ---------- */
function openImportModal(){
  openModal(`
    <div class="modal-head">
      <h3>Importar planilha de padrões</h3>
      <button class="modal-close" id="modal-close">✕</button>
    </div>
    <div class="modal-body">
      <div class="hint">
        A planilha deve ter uma linha de cabeçalho e as colunas nesta ordem:<br>
        <strong>1. ID (Arkmeds)</strong> · <strong>2. Equipamento</strong> · <strong>3. Vencimento (DD/MM/AAAA)</strong> · <strong>4. Oficina padrão</strong> · <strong>5. Oficina atual (opcional)</strong>
      </div>
      <div class="hint" style="margin-top:6px;">Oficinas com nomes que ainda não existem no cadastro serão criadas automaticamente.</div>
      <div class="field" style="margin-top:14px;">
        <label for="imp-file">Arquivo (.xlsx ou .csv)</label>
        <input type="file" id="imp-file" accept=".xlsx,.xls,.csv">
      </div>
      <div id="imp-preview" class="hint" style="margin-top:10px;"></div>
    </div>
    <div class="modal-foot">
      <button class="btn secondary" id="modal-cancel">Cancelar</button>
      <button class="btn" id="modal-save" disabled>Importar</button>
    </div>
  `);
  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('modal-cancel').addEventListener('click', closeModal);

  let parsedRows = [];

  document.getElementById('imp-file').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    const preview = document.getElementById('imp-preview');
    const saveBtn = document.getElementById('modal-save');
    parsedRows = [];
    saveBtn.disabled = true;
    if(!file) return;
    if(typeof XLSX === 'undefined'){
      preview.textContent = 'Não foi possível carregar o leitor de planilhas. Verifique sua conexão e tente novamente.';
      return;
    }
    try{
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, {type:'array', cellDates:true});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, {header:1, raw:false, defval:''});
      const rowsRaw = XLSX.utils.sheet_to_json(sheet, {header:1, raw:true, defval:''});
      const dataRows = rows.slice(1).filter(r => r.some(c => String(c).trim() !== ''));
      const dataRowsRaw = rowsRaw.slice(1);
      parsedRows = dataRows.map((r, i) => ({
        ferramentaId: String(r[0]||'').trim(),
        tipo: String(r[1]||'').trim(),
        vencimento: extractCellDate((dataRowsRaw[i]||[])[2], r[2]),
        oficinaPadraoNome: String(r[3]||'').trim(),
        oficinaAtualNome: String(r[4]||'').trim(),
      })).filter(r => r.ferramentaId && r.tipo);
      if(parsedRows.length === 0){
        preview.textContent = 'Nenhum registro válido encontrado (confira se a coluna 1 = ID e coluna 2 = Equipamento estão preenchidas).';
      } else {
        preview.textContent = parsedRows.length + ' registro(s) encontrados e prontos para importar.';
        saveBtn.disabled = false;
      }
    }catch(err){
      preview.textContent = 'Não foi possível ler esse arquivo. Confira o formato e tente novamente.';
    }
  });

  document.getElementById('modal-save').addEventListener('click', async () => {
    const findOrCreateLocation = (nome) => {
      if(!nome) return '';
      let loc = State.locations.find(l => l.nome.trim().toLowerCase() === nome.trim().toLowerCase());
      if(!loc){
        loc = { id: uid('loc'), nome: nome.trim(), cidade: '' };
        State.locations.push(loc);
      }
      return loc.id;
    };
    parsedRows.forEach(r => {
      const oficinaPadraoId = findOrCreateLocation(r.oficinaPadraoNome);
      const oficinaAtualId = r.oficinaAtualNome ? findOrCreateLocation(r.oficinaAtualNome) : oficinaPadraoId;
      State.tools.push({
        id: uid('tool'),
        ferramentaId: r.ferramentaId,
        tipo: r.tipo,
        marca: '',
        modelo: '',
        numeroSerie: '',
        vencimento: r.vencimento,
        localUsoId: oficinaPadraoId,
        oficinaAtualId: oficinaAtualId,
        status: 'Disponível',
        tecnicoId: '',
      });
    });
    await persist('tools', 'Importou ' + parsedRows.length + ' padrão(ões) via planilha');
    await persist('locations');
    closeModal();
    render();
  });
}

    }
    if(view === 'tecnicos' && f.k === 'pin' && window.usingFirebaseAuth){
      const placeholder = (editing && editing.temPin)
        ? 'PIN já definido — digite um valor novo só se quiser trocar'
        : 'Defina um PIN de acesso para ele entrar no sistema';
      return `
        <div class="field">
          <label for="sf-${i}">${f.label}</label>
          <input type="text" id="sf-${i}" placeholder="${placeholder}" value="">
        </div>
      `;
    }
    return `
      <div class="field">
        <label for="sf-${i}">${f.label}</label>
        <input type="text" id="sf-${i}" placeholder="${f.placeholder}" value="${editing ? escapeHtml(editing[f.k] || '') : ''}">
      </div>
    `;
  }).join('');

  openModal(`
    <div class="modal-head">
      <h3>${editing ? 'Editar ' + cfg.label : 'Novo ' + cfg.label}</h3>
      <button class="modal-close" id="modal-close">✕</button>
    </div>
    <div class="modal-body">${fieldsHtml}</div>
    <div class="modal-foot">
      ${editing ? '<button class="btn danger" id="modal-delete" style="margin-right:auto;">Remover</button>' : ''}
      <button class="btn secondary" id="modal-cancel">Cancelar</button>
      <button class="btn" id="modal-save">${editing ? 'Salvar' : 'Cadastrar'}</button>
    </div>
  `);

  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('modal-cancel').addEventListener('click', closeModal);
  if(editing) document.getElementById('modal-delete').addEventListener('click', () => { deleteSimple(view, editing.id); });

  document.getElementById('modal-save').addEventListener('click', async () => {
    const values = {};
    fields.forEach((f,i) => values[f.k] = document.getElementById('sf-'+i).value.trim());
    if(!values[fields[0].k]){ showAlert('Preencha o campo "' + fields[0].label + '".'); return; }

    const usaPinFirebase = view === 'tecnicos' && window.usingFirebaseAuth;
    const novoPin = usaPinFirebase ? values.pin : null;
    if(usaPinFirebase) delete values.pin; // tratado separadamente abaixo

    let item;
    if(editing){
      Object.assign(editing, values);
      item = editing;
    } else {
      item = { id: uid(view.slice(0,3)), ...values };
      State[cfg.key].push(item);
    }

    if(usaPinFirebase && novoPin){
      // Em branco = não trocar (o PIN atual continua igual). Para remover
      // o PIN de verdade, existe o botão "Redefinir PIN" na listagem.
      if(editing) item.pinVersao = (item.pinVersao || 1) + 1;
      try{ await criarContaAuthSecundaria(emailAuthTecnico(item), novoPin); }
      catch(e){ showAlert('Não foi possível criar o login deste técnico agora. Verifique a conexão e tente de novo.'); return; }
      item.temPin = true;
      delete item.pin;
    }

    persist(cfg.key, (editing ? 'Editou ' : 'Cadastrou ') + cfg.label + ': ' + values[fields[0].k]);
    closeModal();
    render();
  });
}
async function deleteSimple(view, id){
  const cfg = SIMPLE_CONFIG[view];
  if(!(await confirmAction('Remover este registro?'))) return;
  const item = findById(State[cfg.key], id);
  State[cfg.key] = State[cfg.key].filter(x => x.id !== id);
  persist(cfg.key, 'Removeu ' + cfg.label + ': ' + (item ? item.nome : id));
  render();
}

/* ---------- Importação de planilha de clientes ---------- */
function openImportClientesModal(){
  openModal(`
    <div class="modal-head">
      <h3>Importar planilha de clientes</h3>
      <button class="modal-close" id="modal-close">✕</button>
    </div>
    <div class="modal-body">
      <div class="hint">
        A planilha deve ter uma linha de cabeçalho e as colunas nesta ordem:<br>
        <strong>1. ID (Arkmeds)</strong> · <strong>2. Nome</strong> · <strong>3. Cidade</strong> · <strong>4. CNPJ</strong>
      </div>
      <div class="field" style="margin-top:14px;">
        <label for="impcli-file">Arquivo (.xlsx ou .csv)</label>
        <input type="file" id="impcli-file" accept=".xlsx,.xls,.csv">
      </div>
      <div id="impcli-preview" class="hint" style="margin-top:10px;"></div>
    </div>
    <div class="modal-foot">
      <button class="btn secondary" id="modal-cancel">Cancelar</button>
      <button class="btn" id="modal-save" disabled>Importar</button>
    </div>
  `);
  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('modal-cancel').addEventListener('click', closeModal);

  let parsedRows = [];

  document.getElementById('impcli-file').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    const preview = document.getElementById('impcli-preview');
    const saveBtn = document.getElementById('modal-save');
    parsedRows = [];
    saveBtn.disabled = true;
    if(!file) return;
    if(typeof XLSX === 'undefined'){
      preview.textContent = 'Não foi possível carregar o leitor de planilhas. Verifique sua conexão e tente novamente.';
      return;
    }
    try{
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, {type:'array'});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, {header:1, raw:false, defval:''});
      const dataRows = rows.slice(1).filter(r => r.some(c => String(c).trim() !== ''));
      parsedRows = dataRows.map(r => ({
        clienteId: String(r[0]||'').trim(),
        nome: String(r[1]||'').trim(),
        cidade: String(r[2]||'').trim(),
        cnpj: String(r[3]||'').trim(),
      })).filter(r => r.nome);
      if(parsedRows.length === 0){
        preview.textContent = 'Nenhum registro válido encontrado (confira se a coluna 2 = Nome está preenchida).';
      } else {
        preview.textContent = parsedRows.length + ' registro(s) encontrados e prontos para importar.';
        saveBtn.disabled = false;
      }
    }catch(err){
      preview.textContent = 'Não foi possível ler esse arquivo. Confira o formato e tente novamente.';
    }
  });

  document.getElementById('modal-save').addEventListener('click', async () => {
    parsedRows.forEach(r => {
      State.clients.push({ id: uid('cli'), clienteId: r.clienteId, nome: r.nome, cidade: r.cidade, cnpj: r.cnpj });
    });
    await persist('clients', 'Importou ' + parsedRows.length + ' cliente(s) via planilha');
    closeModal();
    render();
  });
}

  }
  const data = editing ? editing.data : (presetDate || todayISO());

  const tecnicoOptions = State.technicians.map(t => `<option value="${t.id}" ${editing?.tecnicoId===t.id?'selected':''}>${escapeHtml(t.nome)}</option>`).join('');
  const technicianFieldHtml = isAdmin() ? `

    <div class="modal-body">
      <div class="field">

        <div class="segmented" id="a-status">

          <button type="button" class="sel-nok ${status==='NOK'?'active':''}" data-val="NOK">NOK</button>
        </div>
      </div>

      <div class="field-row">
        <div class="field">

          <input type="text" id="a-data-inicio" value="${toBRInputValue(data)}" placeholder="DD/MM/AAAA" maxlength="10">
        </div>
        <div class="field">
          <label for="a-data-fim">Data fim</label>
          <input type="text" id="a-data-fim" value="${toBRInputValue(dataFim)}" placeholder="DD/MM/AAAA" maxlength="10">
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="a-inicio">Início</label>

          <input type="time" id="a-fim" value="${editing ? editing.horaFim : '10:00'}" ${editing?.diaTodo ? 'disabled' : ''}>
        </div>
      </div>
      <div class="field" style="display:flex; align-items:center; gap:8px; margin-top:-6px;">
        <input type="checkbox" id="a-dia-todo" ${editing?.diaTodo ? 'checked' : ''} style="width:16px; height:16px;">
        <label for="a-dia-todo" style="margin:0;">Dia todo</label>

      <div class="field">

        <select id="a-tipo">
          <option value="">Selecione...</option>
          ${State.serviceTypes.map(st => `<option value="${escapeHtml(st.nome)}" ${editing?.tipoServico===st.nome?'selected':''}>${escapeHtml(st.nome)}</option>`).join('')}
          ${editing && editing.tipoServico && !State.serviceTypes.some(st => st.nome === editing.tipoServico) ? `<option value="${escapeHtml(editing.tipoServico)}" selected>${escapeHtml(editing.tipoServico)} (não cadastrado)</option>` : ''}
        </select>
        ${State.serviceTypes.length===0 ? '<div class="hint">Nenhum tipo de serviço cadastrado ainda — cadastre em "Tipos de Serviço".</div>' : ''}
      </div>

      <div class="field-row">
        <div class="field">

          <select id="a-cliente">
            <option value="">Selecione...</option>
            ${clienteOptions}
          </select>
        </div>
        <div class="field">
          <label for="a-cidade">Cidade</label>
          <input type="text" id="a-cidade" placeholder="Cidade do atendimento" value="${editing ? escapeHtml(editing.cidade) : ''}">
        </div>
      </div>
      ${State.clients.length===0 ? '<div class="hint">Nenhum cliente cadastrado ainda — cadastre em "Clientes".</div>' : ''}

      <div class="field">
        <label>Padrões utilizados</label>
        ${State.tools.length > 0 ? `<input type="text" id="a-ferramenta-busca" placeholder="Buscar por ID ou tipo..." style="margin-bottom:6px; padding:6px 8px; font-size:12.5px; width:100%; box-sizing:border-box; border:1px solid var(--line-strong); border-radius:var(--radius-s); font-family:inherit;">` : ''}
        <div id="a-ferramentas-lista" style="max-height:170px; overflow-y:auto; border:1px solid var(--line-strong); border-radius:var(--radius-s); padding:6px 10px;">
          ${ferramentaChecklist || '<div class="hint" style="padding:6px 0;">Nenhum padrão disponível.</div>'}
        </div>
        <div class="hint">Pode marcar mais de um. Padrões vencidos não aparecem na lista — regularize o vencimento em "Ferramentas" para liberá-los.</div>
      </div>

      ${technicianFieldHtml}

      <div class="field">
        <label>Título gerado</label>
        <div class="title-preview" id="title-preview"><strong>—</strong></div>
      </div>

    </div>
  `);

  let currentStatus = status;
  const statusBtns = document.querySelectorAll('#a-status button');
  statusBtns.forEach(b => b.addEventListener('click', () => {
    currentStatus = b.dataset.val;
    statusBtns.forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    updatePreview();
  }));

  // Auto-preenche cidade a partir do cliente selecionado (se vazio)
  document.getElementById('a-cliente').addEventListener('change', (e) => {
    const cidadeField = document.getElementById('a-cidade');
    const cliente = findById(State.clients, e.target.value);
    if(cliente && cliente.cidade && !cidadeField.value){
      cidadeField.value = cliente.cidade;
    }
    updatePreview();
  });

  ['a-tipo','a-cidade','a-inicio','a-fim','a-data-inicio','a-data-fim','a-tecnico'].forEach(idAttr => {
    document.getElementById(idAttr).addEventListener('input', updatePreview);
    document.getElementById(idAttr).addEventListener('change', updatePreview);
  });
  document.querySelectorAll('.a-ferramenta-chk').forEach(chk => chk.addEventListener('change', updatePreview));
  const aFerramentaBusca = document.getElementById('a-ferramenta-busca');
  if(aFerramentaBusca) aFerramentaBusca.addEventListener('input', () => {

      lbl.style.display = (!termo || (lbl.dataset.busca || '').includes(termo)) ? 'flex' : 'none';
